name: R190-BU Rifted City real-voxel source research (NO NETWORK)
on:
  push:
    branches: [feature/b198zr1-protected-architectural-revision]
    paths:
      - 'evidence/r190bu/**'
      - 'scripts/r190bu-rifted-city-study.mjs'
      - '.github/workflows/r190bu-rifted-city.yml'
  pull_request:
    paths:
      - 'evidence/r190bu/**'
      - 'scripts/r190bu-rifted-city-study.mjs'
      - '.github/workflows/r190bu-rifted-city.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rift-exact-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact B143 3D, both main voids, 20 spaces and 8 destinations (NO provider)
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
        run: node scripts/r190bu-rifted-city-study.mjs --out bu-ci-evidence
      - name: Preserve originals, failed/HOLD sources, and every independent view
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R190BU-RIFT-CITY-OFFLINE-${{ matrix.os }}
          path: bu-ci-evidence
          if-no-files-found: warn
