name: R190-BO Spatial Assembly local path — ZERO NETWORK TESTS
on:
  push:
    branches: [feature/b198zr1-protected-architectural-revision]
    paths:
      - 'source/ai/r190b[n-o]-*'
      - 'source/ai/r190bq-*'
      - 'scripts/r190b[n-o]-*'
      - 'scripts/fixtures/r190bn-*'
      - 'RUN_R190BO_OFFLINE_PREFLIGHT.cmd'
      - 'source/ai/r125-education-makecode-export.mjs'
      - 'scripts/r125-*makecode*.mjs'
      - 'scripts/r125-material-probe*.mjs'
      - 'scripts/r125-free-build*.mjs'
      - 'RUN_R125_FREE_BUILD.cmd'
      - 'configs/r125-education-verified-palette-v26.33.json'
      - 'scripts/r125-export-education-pilot.mjs'
      - '.github/workflows/r190bo-spatial-local.yml'
  pull_request:
    paths:
      - 'source/ai/r190b[n-o]-*'
      - 'source/ai/r190bq-*'
      - 'scripts/r190b[n-o]-*'
      - 'scripts/fixtures/r190bn-*'
      - 'RUN_R190BO_OFFLINE_PREFLIGHT.cmd'
      - 'source/ai/r125-education-makecode-export.mjs'
      - 'scripts/r125-*makecode*.mjs'
      - 'scripts/r125-material-probe*.mjs'
      - 'scripts/r125-free-build*.mjs'
      - 'RUN_R125_FREE_BUILD.cmd'
      - 'configs/r125-education-verified-palette-v26.33.json'
      - 'scripts/r125-export-education-pilot.mjs'
      - '.github/workflows/r190bo-spatial-local.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: New BN model contract, fake transport and real CLI regressions
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
          R190_COMPACT_ARTIFACT_DIR: r190-compact-demo
        run: node --test scripts/r190bo-local-http.test.mjs scripts/r190bo-spatial-local.test.mjs scripts/r190bo-one-model-gate.test.mjs scripts/r190bn-spatial-assembly.test.mjs scripts/r190bn-compact-architecture-plan.test.mjs scripts/r190bn-compact-to-bn.test.mjs scripts/r125-education-makecode-export.test.mjs scripts/r125-material-probe.test.mjs scripts/r125-free-build.test.mjs
      - name: Existing immutable BM, provenance and comparison regressions
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
        run: node --test scripts/r190bf-controlled-pair.test.mjs scripts/r190be-saved-design-comparison.test.mjs scripts/r190bg-source-anchored-review.test.mjs scripts/r190bj-failure-informed-prompt.test.mjs scripts/r190bk-evidence-stage-review.test.mjs
      - name: Offline BM preparation and synthetic end-to-end evidence (NO model)
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
        run: node scripts/r190bo-offline-study.mjs --out bo-ci-evidence
      - name: Generate real B143-to-MakeCode trial file (NO world contact)
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
        run: node scripts/r125-education-makecode-demo.mjs --out r125-education-demo
      - name: Actual Windows offline CMD, no Ollama
        if: runner.os == 'Windows'
        shell: cmd
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
        run: RUN_R190BO_OFFLINE_PREFLIGHT.cmd
      - name: Smoke-test real paired runner preflight without local-model transport
        shell: pwsh
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
        run: |
          & ./scripts/r190bo-real-pair.ps1 -PrepareOnly -OutputRoot bo-real-pair-preflight
          $report = Get-Content -LiteralPath bo-real-pair-preflight/RESULT_SUMMARY.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($report.modelResults.Count -ne 2 -or $report.automaticRetryCount -ne 0) { throw 'R190BO_PREFLIGHT_RUNNER_REPORT' }
          foreach ($case in $report.modelResults) {
            if ($case.status -ne 'PREFLIGHT_ONLY' -or $case.actualProviderRequests -ne 0) { throw 'R190BO_UNAUTHORIZED_INFERENCE' }
          }
          if (Test-Path bo-real-pair-preflight/qwen3-14b/capture) { throw 'R190BO_CAPTURE_BEFORE_AUTHORIZATION' }
      - name: Windows PowerShell 5.1 UTF-8 Japanese script preflight (NO MODEL CALLS)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\r190bo-real-pair.ps1 -PrepareOnly -OutputRoot bo-real-pair-ps51
          if ($LASTEXITCODE -ne 0) { throw 'R190BO_WINDOWS_POWERSHELL_51_PREFLIGHT_FAILED' }
          $report = Get-Content -LiteralPath bo-real-pair-ps51/RESULT_SUMMARY.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($report.modelResults.Count -ne 2 -or $report.modelResults[0].actualProviderRequests -ne 0 -or $report.modelResults[1].actualProviderRequests -ne 0) {
            throw 'R190BO_UNEXPECTED_POST_BEFORE_APPROVAL'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: R190BO-OFFLINE-NO-MODEL-${{ matrix.os }}
          path: |
            bo-ci-evidence
            r190-compact-demo
            r125-education-demo
