name: B127 offline halfstep stair facing hypothesis calibration gate
on:
  pull_request:
    paths:
      - 'source/parallel/b127/**'
      - '.github/workflows/b127.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b127-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen B100 source
        run: node scripts/verify-freeze.mjs
      - name: Eight synthetic halfstep and orientation hypothesis cases
        run: node --test source/parallel/b127/main/b127-halfstep-orientation.test.mjs
      - name: Generate B114 pinned source
        run: node source/parallel/b114/main/b114-batch-review.mjs
      - name: Generate B117 conceptual slab source
        run: node source/parallel/b117/main/b117-fleet-review.mjs
      - name: Generate B118 all held exits source
        run: node source/parallel/b118/main/b118-fleet-review.mjs
      - name: Generate B119 whole stair source
        run: node source/parallel/b119/main/b119-fleet-whole-stair-review.mjs
      - name: Generate B120 bounded return source
        run: node source/parallel/b120/main/b120-fleet-review.mjs
      - name: Generate B121 joint stair corridor source
        run: node source/parallel/b121/main/b121-fleet-review.mjs
      - name: Generate B122 corridor source
        run: node source/parallel/b122/main/b122-fleet-route-review.mjs
      - name: Generate B123 network source
        run: node source/parallel/b123/main/b123-fleet-network-review.mjs
      - name: Generate B124 scoped 3D transition
        run: node source/parallel/b124/main/b124-fleet-3d-review.mjs
      - name: Generate B125 fine half-step landing
        run: node source/parallel/b125/main/b125-fleet-fine-review.mjs
      - name: Generate B126 candidate stair blocks
        run: node source/parallel/b126/main/b126-fleet-blockstate-review.mjs
      - name: Generate B127 halfstep shape and direction hypothesis report
        run: node source/parallel/b127/main/b127-fleet-calibration-review.mjs
      - name: Verify 15 buildings, 102 stairs, 24 unverified mappings and safety HOLD
        run: node --test source/parallel/b127/main/b127-fleet-calibration-review.test.mjs
      - name: Verify original construction gate unchanged
        run: node scripts/verify-b114-safety.mjs
      - name: Upload offline B127 design evidence
        uses: actions/upload-artifact@v4
        with:
          name: B127-Offline-Halfstep-Orientation-Hypotheses
          path: b127-review-output/
          retention-days: 14
          if-no-files-found: error
