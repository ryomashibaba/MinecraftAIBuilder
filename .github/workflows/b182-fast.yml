name: B182 Aerial Switchback Ten-Module Megafacade
on:
  push:
    branches: [feature/b182-nebula-ark-aerial-switchback-megafacade]
    paths:
      - 'source/ai/b182-switchback.mjs'
      - 'scripts/b182-fast-probe.mjs'
      - 'scripts/b182-macro.test.mjs'
      - 'scripts/b182-build-preview.mjs'
      - 'scripts/b182-browser-qa.mjs'
      - '.github/workflows/b182-fast.yml'
  pull_request:
    paths:
      - 'source/ai/b182-switchback.mjs'
      - 'scripts/b182-fast-probe.mjs'
      - 'scripts/b182-macro.test.mjs'
      - 'scripts/b182-build-preview.mjs'
      - 'scripts/b182-browser-qa.mjs'
      - '.github/workflows/b182-fast.yml'
permissions:
  contents: read
concurrency:
  group: b182-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macro-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source and safe build scripts
        run: |
          node --check source/ai/b182-switchback.mjs
          node --check scripts/b182-fast-probe.mjs
      - name: Nine 4-riser switchback flights and 36 2x2-supported treads plus massive skyline
        run: node scripts/b182-fast-probe.mjs
      - name: Architecture geometry, obstruction and anti-forgery tests
        if: hashFiles('scripts/b182-macro.test.mjs') != ''
        run: node --test scripts/b182-macro.test.mjs
      - name: Build standalone offline 3D city preview
        if: hashFiles('scripts/b182-build-preview.mjs') != ''
        run: node scripts/b182-build-preview.mjs
      - name: Archive city-scale voxel model and interactive preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B182-NEBULA-ARK-Grand-Terminal-3D
          path: b182-evidence/
          if-no-files-found: warn
          retention-days: 14

  chromium-visual-qa:
    needs: [macro-architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA runtime without lockfile mutation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Regenerate offline 3D model from pinned source
        run: node scripts/b182-build-preview.mjs
      - name: Test real Chromium desktop/mobile canvas, all presets, and save screenshots
        run: node scripts/b182-browser-qa.mjs
      - name: Upload actual rendered visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B182-NEBULA-ARK-Desktop-Mobile-Screenshots
          path: |
            b182-evidence/B182_DESKTOP.png
            b182-evidence/B182_MOBILE.png
            b182-evidence/B182_CHROMIUM_QA.json
          if-no-files-found: warn
          retention-days: 14
