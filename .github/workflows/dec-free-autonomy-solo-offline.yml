name: Dec free-autonomy single-project pilot (fake QA + real Docker smoke)

on:
  push:
    branches:
      - research/dec-free-autonomy-solo-pilot-20261104
    paths:
      - 'tools/free-autonomy-solo/**'
      - '.github/workflows/dec-free-autonomy-solo-offline.yml'
  workflow_dispatch:

# Keep only the newest push's identical CI workload. A manually dispatched
# genuine free-model trial must not be canceled by an unrelated code push.
concurrency:
  group: dec-free-autonomy-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  offline-contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax check
        run: python3 -m py_compile tools/free-autonomy-solo/solo_agent.py tools/free-autonomy-solo/docker_sandbox.py tools/free-autonomy-solo/docker_native_probe.py tools/free-autonomy-solo/run_mab_private_autonomy_once.py
      - name: Isolated fake OpenCode CLI safety regression
        run: python3 -m unittest discover -v -s tools/free-autonomy-solo -p 'test_*.py'
      - name: Evidence limitations
        run: |
          echo 'Fake CLI contract tests only. Real LLM, Windows and project quality remain unverified.'

  native-docker-smoke-no-llm:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain public QA runtime image (no model image or credentials)
        run: docker pull node:22-bookworm-slim
      - name: Actually start Docker and assert isolation/timeout
        run: python3 tools/free-autonomy-solo/docker_native_probe.py
      - name: Explicit certification scope
        run: |
          echo 'REAL Docker Linux ephemeral smoke ONLY.'
          echo 'OpenCode, Ollama/Qwen, Windows Docker, GitHub push and multi-step autonomy remain HOLD.'

  real-opencode-v2-cli-no-llm:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain public OpenCode 2 image without any model/auth
        run: docker pull ghcr.io/anomalyco/opencode:2.0.0
      - name: Run OpenCode CLI help within Docker sandbox (NO LLM)
        run: python3 tools/free-autonomy-solo/opencode_native_probe.py
      - name: Explicit HOLD boundary
        run: echo 'CLI process launch only. Model generation, Windows isolation and autonomy are not verified.'

  genuine-free-model-once-ephemeral:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull the fixed OpenCode CLI container (no credentials)
        run: docker pull ghcr.io/anomalyco/opencode:2.0.0
      - name: One signed-out FREE model coding attempt on disposable public fixture
        run: python3 tools/free-autonomy-solo/free_model_real_once.py
      - name: Preserve limited evidence scope
        if: always()
        run: |
          echo 'Real FREE-model call attempt once; no paid API credentials.'
          echo 'No Windows, original project editing or long-running autonomous development attested.'

  windows-readonly-ps-parser:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PowerShell AST parsing only (no Docker/model/network invocation)
        shell: pwsh
        run: |
          foreach ($file in @(
            'tools/free-autonomy-solo/windows_readonly_audit.ps1',
            'tools/free-autonomy-solo/RUN_PREPARE_REAL_PROJECT_ONCE.ps1',
            'tools/free-autonomy-solo/RUN_QWEN14B_REAL_SOURCE_DRAFT_ONCE.ps1',
            'tools/free-autonomy-solo/RUN_REAL_MAB_V4H_14B_ARCHITECTURE.ps1',
            'tools/free-autonomy-solo/RUN_PRIVATE_MAB_SOURCE_SESSION.ps1',
            'tools/free-autonomy-solo/RUN_QWEN14B_TO_PUBLIC_GITHUB_QA_ONCE.ps1',
            'tools/free-autonomy-solo/RUN_CHECK_EXISTING_PRIVATE_DRAFTS_ONCE.ps1',
            'tools/free-autonomy-solo/RUN_PUBLISH_EXISTING_QWEN_MAB_TWO_DRAFTS.ps1',
            'tools/free-autonomy-solo/RUN_REVIEW_AND_SUBMIT_EXISTING_QWEN_QA.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { $parseErrors | Format-List | Out-String | Write-Host; exit 2 }
          }
          Write-Host 'WINDOWS_READONLY_AND_PINNED_CLONE_PS_AST_PASS'
          # Exercise the Windows double-click bootstrap in a mode that never
          # downloads source, invokes Ollama, or modifies any repository.
          & cmd /c 'tools\free-autonomy-solo\RUN_FIRST_PRIVATE_REAL_MODEL_PILOT.cmd' --ci-self-test
          if ($LASTEXITCODE -ne 0) { exit 2 }
          Write-Host 'WINDOWS_PRIVATE_PILOT_CMD_SELF_TEST_NO_MODEL'
          & ./tools/free-autonomy-solo/RUN_REAL_MAB_V4H_14B_ARCHITECTURE.ps1 -CiSelfTest
          if ($LASTEXITCODE -ne 0) { exit 2 }
          & cmd /c 'tools\free-autonomy-solo\RUN_REAL_MAB_V4H_14B_ARCHITECTURE.cmd' --ci-self-test
          if ($LASTEXITCODE -ne 0) { exit 2 }
          Write-Host 'WINDOWS_REAL_14B_V4H_ARCHITECTURE_BOOTSTRAP_STATIC_PASS'
          & ./tools/free-autonomy-solo/RUN_PRIVATE_MAB_SOURCE_SESSION.ps1 -CiSelfTest
          if ($LASTEXITCODE -ne 0) { exit 2 }
          & cmd /c 'tools\free-autonomy-solo\RUN_PRIVATE_MAB_SOURCE_SESSION.cmd' --ci-self-test
          if ($LASTEXITCODE -ne 0) { exit 2 }
          Write-Host 'WINDOWS_PRIVATE_MAB_ONE_SESSION_BOOTSTRAP_STATIC_PASS_NO_MODEL'
          & cmd /c 'tools\free-autonomy-solo\RUN_CHECK_EXISTING_PRIVATE_DRAFTS_ONCE.cmd' --ci-self-test
          if ($LASTEXITCODE -ne 0) { exit 2 }
          Write-Host 'WINDOWS_EXISTING_DRAFT_STATIC_PREFLIGHT_CMD_SELF_TEST'
          # Public source submission code is parsed/smoked, NEVER invoked
          # in CI, which has no user consent or private source drafts.
          & cmd /c 'tools\free-autonomy-solo\RUN_PUBLISH_EXISTING_QWEN_MAB_TWO_DRAFTS.cmd' --ci-self-test
          if ($LASTEXITCODE -ne 0) { exit 2 }
          Write-Host 'WINDOWS_PUBLIC_QWEN_HANDOFF_CMD_SELF_TEST_NO_PUSH'
          & cmd /c 'tools\free-autonomy-solo\RUN_REVIEW_AND_SUBMIT_EXISTING_QWEN_QA.cmd' --ci-self-test
          if ($LASTEXITCODE -ne 0) { exit 2 }
          Write-Host 'WINDOWS_REVIEWED_PUBLIC_QWEN_CMD_SELF_TEST_NO_PUSH'


  windows-no-docker-python-contract:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: No-Docker local-model AST interpreter offline regression on genuine Windows Python
        shell: pwsh
        run: |
          python -m py_compile tools/free-autonomy-solo/local_qwen_no_docker_two_step.py
          python -m unittest discover -v -s tools/free-autonomy-solo -p test_local_qwen_no_docker_two_step.py
      - name: Honest test boundary
        shell: pwsh
        run: |
          Write-Host 'Real Windows CPython mock tests ONLY. No Ollama/Qwen inference, no Docker, no user machine.'


  windows-shared-single-local-model-lock:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prove Windows OS-level cross-process lock excludes parallel MAB + TPS agents
        shell: pwsh
        run: |
          python -m unittest discover -v -s tools/free-autonomy-solo -p test_solo_agent.py -k one_local_agent_lock
      - name: Evidence scope
        shell: pwsh
        run: |
          Write-Host 'Real Windows msvcrt cross-process lock only. No Qwen/Ollama inference or actual project mutation.'

  windows-real-project-two-draft-mock:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Actual Windows Git clone fixture + MOCK two-source Qwen proposal tests
        shell: pwsh
        run: |
          python -m py_compile tools/free-autonomy-solo/draft_real_project_local14b.py
          python -m unittest discover -v -s tools/free-autonomy-solo -p test_draft_real_project_local14b.py
          Write-Host 'MOCK_MODEL_ONLY_AND_NO_UNTRUSTED_CODE_EXECUTED'



  windows-private-source-promotion-mock:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Actual Windows Git fixture confirms two-stage QA gating, no actual Docker or model
        shell: pwsh
        run: |
          python -m py_compile tools/free-autonomy-solo/promote_private_real_drafts_docker.py
          python -m unittest discover -v -s tools/free-autonomy-solo -p test_promote_private_real_drafts_docker.py
          Write-Host 'WINDOWS_LOCAL_GIT_COMMIT_GATE_MOCK_DOCKER_QA_ONLY__MODEL_HOLD'



  windows-public-source-handoff-mock:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Real Windows Git public source privacy + tamper rejection, fake Docker only
        shell: pwsh
        run: |
          python -m py_compile tools/free-autonomy-solo/public_qa_handoff_protocol.py tools/free-autonomy-solo/receive_public_research_qa.py tools/free-autonomy-solo/submit_public_research_qa.py
          python -m unittest discover -v -s tools/free-autonomy-solo -p test_public_source_qa_handoff.py
          python -m unittest discover -v -s tools/free-autonomy-solo -p test_receive_public_research_qa.py
          Write-Host 'PUBLIC_HANDOFF_WINDOWS_MOCK_ONLY_NO_GIT_PUSH_NO_REAL_QWEN'

  windows-real-14b-architecture-offline:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Genuine Windows Python 3.13 static syntax and model-free original architect regression
        shell: pwsh
        run: |
          python -m py_compile tools/free-autonomy-solo/real_mab_original_architecture_batch.py
          python tools/free-autonomy-solo/real_mab_original_architecture_batch.py --ci-self-test
          if ($LASTEXITCODE -ne 0) { exit 2 }
          python -m unittest discover -v -s tools/free-autonomy-solo -p test_real_mab_original_architecture_batch.py
          if ($LASTEXITCODE -ne 0) { exit 2 }
          Write-Host 'REAL_WINDOWS_PYTHON_STATIC_AND_MOCK_PASSES__NO_QWEN_RUN'
