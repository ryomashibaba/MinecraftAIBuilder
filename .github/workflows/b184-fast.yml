name: B184 Panorama Crown Twelve-Module Sky Parks
on:
  push:
    branches: [feature/b184-nebula-ark-panorama-crown-skyparks]
    paths:
      - 'source/ai/b184-panorama-crown.mjs'
      - 'scripts/b184-fast-probe.mjs'
      - 'scripts/b184-macro.test.mjs'
      - 'scripts/b184-build-preview.mjs'
      - 'scripts/b184-browser-qa.mjs'
      - '.github/workflows/b184-fast.yml'
  pull_request:
    paths:
      - 'source/ai/b184-panorama-crown.mjs'
      - 'scripts/b184-fast-probe.mjs'
      - 'scripts/b184-macro.test.mjs'
      - 'scripts/b184-build-preview.mjs'
      - 'scripts/b184-browser-qa.mjs'
      - '.github/workflows/b184-fast.yml'
permissions:
  contents: read
concurrency:
  group: b184-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macro-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source and safe build scripts
        run: |
          node --check source/ai/b184-panorama-crown.mjs
          node --check scripts/b184-fast-probe.mjs
      - name: Three source-connected rooftop sky parks and 99-move panorama concourse
        run: node scripts/b184-fast-probe.mjs
      - name: Architecture geometry, obstruction and anti-forgery tests
        if: hashFiles('scripts/b184-macro.test.mjs') != ''
        run: node --test scripts/b184-macro.test.mjs
      - name: Build standalone offline 3D city preview
        if: hashFiles('scripts/b184-build-preview.mjs') != ''
        run: node scripts/b184-build-preview.mjs
      - name: Archive city-scale voxel model and interactive preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B184-NEBULA-ARK-Grand-Terminal-3D
          path: b184-evidence/
          if-no-files-found: warn
          retention-days: 14

  chromium-visual-qa:
    needs: [macro-architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA runtime without lockfile mutation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Regenerate offline 3D model from pinned source
        run: node scripts/b184-build-preview.mjs
      - name: Test real Chromium desktop/mobile canvas, all presets, and save screenshots
        run: node scripts/b184-browser-qa.mjs
      - name: Upload actual rendered visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B184-NEBULA-ARK-Desktop-Mobile-Screenshots
          path: |
            b184-evidence/B184_DESKTOP.png
            b184-evidence/B184_MOBILE.png
            b184-evidence/B184_CHROMIUM_QA.json
          if-no-files-found: warn
          retention-days: 14
