name: B192 Celestial Skybridge Independent Architectural 3D Module
on:
  push:
    branches: [feature/b192-nebula-ark-skybridge-architecture]
    paths:
      - 'source/ai/b192-skybridge-architecture.mjs'
      - 'scripts/b192-fast-probe.mjs'
      - 'scripts/b192-macro.test.mjs'
      - 'scripts/b192-build-preview.mjs'
      - 'scripts/b192-browser-qa.mjs'
      - '.github/workflows/b192-fast.yml'
  pull_request:
    paths:
      - 'source/ai/b192-skybridge-architecture.mjs'
      - 'scripts/b192-fast-probe.mjs'
      - 'scripts/b192-macro.test.mjs'
      - 'scripts/b192-build-preview.mjs'
      - 'scripts/b192-browser-qa.mjs'
      - '.github/workflows/b192-fast.yml'
permissions:
  contents: read
concurrency:
  group: b192-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macro-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source and safe build scripts
        run: |
          node --check source/ai/b192-skybridge-architecture.mjs
          node --check scripts/b192-fast-probe.mjs
      - name: Distinct source-compiled genuine skybridge architecture, no model overlaps and full 2wide Y69 traverse
        run: node scripts/b192-fast-probe.mjs
      - name: Architecture geometry, obstruction and anti-forgery tests
        if: hashFiles('scripts/b192-macro.test.mjs') != ''
        run: node --test scripts/b192-macro.test.mjs
      - name: Build standalone offline 3D city preview
        if: hashFiles('scripts/b192-build-preview.mjs') != ''
        run: node scripts/b192-build-preview.mjs
      - name: Archive city-scale voxel model and interactive preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B192-NEBULA-ARK-Grand-Terminal-3D
          path: b192-evidence/
          if-no-files-found: warn
          retention-days: 14

  chromium-visual-qa:
    needs: [macro-architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA runtime without lockfile mutation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Regenerate offline 3D model from pinned source
        run: node scripts/b192-build-preview.mjs
      - name: Test real Chromium desktop/mobile canvas, all presets, and save screenshots
        run: node scripts/b192-browser-qa.mjs
      - name: Upload actual rendered visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B192-NEBULA-ARK-Desktop-Mobile-Screenshots
          path: |
            b192-evidence/B192_DESKTOP.png
            b192-evidence/B192_MOBILE.png
            b192-evidence/B192_DESKTOP_ANNEX.png
            b192-evidence/B192_DESKTOP_SKYBRIDGE.png
            b192-evidence/B192_DESKTOP_Y69.png
            b192-evidence/B192_DESKTOP_Y65.png
            b192-evidence/B192_MOBILE_ANNEX.png
            b192-evidence/B192_MOBILE_SKYBRIDGE.png
            b192-evidence/B192_MOBILE_Y69.png
            b192-evidence/B192_MOBILE_Y65.png
            b192-evidence/B192_CHROMIUM_QA.json
          if-no-files-found: warn
          retention-days: 14
