name: R32 Synthetic Geometry Contract
on:
  push:
    branches: [feature/b198zr1-protected-architectural-revision]
    paths:
      - 'scripts/b198zr32-synthetic-geometry-fixtures*'
      - '.github/workflows/r32-synthetic-geometry-contract.yml'
  pull_request:
    paths:
      - 'scripts/b198zr32-synthetic-geometry-fixtures*'
      - '.github/workflows/r32-synthetic-geometry-contract.yml'
permissions:
  contents: read
jobs:
  r32-real-compiler-mock-geometry-only:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute real B143/R3/R4 on synthetic fixtures only; no model or Minecraft
        run: node --test scripts/b198zr32-synthetic-geometry-fixtures.test.mjs
