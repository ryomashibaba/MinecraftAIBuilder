name: Dec genuine Qwen4B MAB three cumulative private SOURCE QA cycles

on:
  push:
    branches:
      - research/dec-free-autonomy-solo-pilot-20261104
    paths:
      - 'tools/free-autonomy-solo/real_qwen4b_cumulative_three_ci.py'
      - '.github/workflows/dec-real-qwen4b-cumulative-three.yml'
  workflow_dispatch:

permissions:
