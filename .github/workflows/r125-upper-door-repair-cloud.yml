name: R125 Saved Qwen C Upper-Floor Door Repair — SOURCE ONLY
on:
  push:
    branches: [feature/b198zr1-protected-architectural-revision]
    paths:
      - 'source/ai/r125-architecture-plan.mjs'
      - 'scripts/r125-upper-door-repair-study.mjs'
      - 'scripts/r125-upper-door-repair-study.test.mjs'
      - 'scripts/r125-roof-interior-study.mjs'
      - 'scripts/r125-roof-interior-study.test.mjs'
      - 'scripts/r125-semantic-pilot.mjs'
      - 'scripts/r125-semantic-pilot.test.mjs'
      - 'scripts/r125-saved-semantic-review.mjs'
      - 'scripts/r125-saved-semantic-review.test.mjs'
      - 'scripts/r125-saved-education-preflight.mjs'
      - 'scripts/r125-saved-education-preflight.test.mjs'
      - 'source/ai/r125-source-routes.mjs'
      - 'source/ai/r125-education-makecode-export.mjs'
      - 'configs/r125-education-verified-palette-v26.33.json'
      - 'scripts/r125-live-safe-worktree.ps1'
      - 'scripts/r125-education-world-inventory.ps1'
      - 'scripts/r125-education-backup-and-candidate-check.ps1'
      - '.github/workflows/r125-upper-door-repair-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r125-door-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verified-source-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse real Windows PowerShell launcher before any Windows handoff
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/r125-live-safe-worktree.ps1').Path,
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw "R125_POWERSHELL_PARSER_FAILED"
          }
          $inventoryTokens = $null
          $inventoryErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/r125-education-world-inventory.ps1').Path,
            [ref]$inventoryTokens, [ref]$inventoryErrors
          ) | Out-Null
          if ($inventoryErrors.Count -gt 0) {
            $inventoryErrors | ForEach-Object { Write-Error $_.ToString() }
            throw "R125_WORLD_INVENTORY_POWERSHELL_PARSER_FAILED"
          }
          $backupTokens = $null
          $backupErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/r125-education-backup-and-candidate-check.ps1').Path,
            [ref]$backupTokens, [ref]$backupErrors
          ) | Out-Null
          if ($backupErrors.Count -gt 0) {
            $backupErrors | ForEach-Object { Write-Error $_.ToString() }
            throw "R125_BACKUP_AND_CANDIDATE_PARSER_FAILED"
          }
          Write-Host 'R125_POWERSHELL_PARSER_PASS (no model calls/world writes)'
      - name: Test read-only world inventory on synthetic file fixture
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mab-world-inventory-fixture'
          $world = Join-Path $root 'synthetic-world-01'
          New-Item -ItemType Directory -Force -Path $world | Out-Null
          [IO.File]::WriteAllText((Join-Path $world 'levelname.txt'), 'SOURCE_TEST_WORLD')
          [IO.File]::WriteAllText((Join-Path $world 'level.dat'), 'TEST_ONLY_NOT_A_REAL_WORLD')
          $before = (Get-FileHash (Join-Path $world 'level.dat') -Algorithm SHA256).Hash
          $output = & pwsh -NoProfile -File 'scripts/r125-education-world-inventory.ps1' -WorldRoots $root | Out-String
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'SOURCE_TEST_WORLD' -or
              $output -notmatch 'zero world writes') {
            throw "R125_WORLD_INVENTORY_TEST_FAILED"
          }
          $after = (Get-FileHash (Join-Path $world 'level.dat') -Algorithm SHA256).Hash
          if ($before -ne $after) { throw "R125_WORLD_INVENTORY_CHANGED_WORLD_DATA" }
          Write-Host 'R125_WORLD_INVENTORY_READONLY_TEST_PASS'
      - name: Test intact old Qwen 2620 reference and opt-in C repair
        run: |
          node --check source/ai/r125-architecture-plan.mjs
          node --check scripts/r125-upper-door-repair-study.mjs
          node --check scripts/r125-roof-interior-study.mjs
          node --check scripts/r125-semantic-pilot.mjs
          node --check scripts/r125-saved-semantic-review.mjs
          node --check scripts/r125-saved-education-preflight.mjs
          node --test scripts/r125-expression-gallery.test.mjs scripts/r125-upper-door-repair-study.test.mjs scripts/r125-roof-interior-study.test.mjs scripts/r125-semantic-pilot.test.mjs scripts/r125-saved-semantic-review.test.mjs scripts/r125-saved-education-preflight.test.mjs
      - name: Real-source 2-width component comparison, no model/world
        run: |
          node scripts/r125-upper-door-repair-study.mjs --out "$RUNNER_TEMP/r125-door-repair"
          node scripts/r125-roof-interior-study.mjs --out "$RUNNER_TEMP/r125-door-repair/roof-interior"
      - name: Report SOURCE proof without claiming actual Minecraft walking
        run: |
          echo '## R125 real Qwen saved geometry — opt-in HOST repair' >> "$GITHUB_STEP_SUMMARY"
          echo 'Original C: 2 disconnected floor regions at standing Y7; separate repaired C: required one region.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Raised sawtooth roof: source-only comparison across synthetic residential, retail and lab programs; human art NOT REVIEWED.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Research only, original Qwen and A–E unchanged, ART HOLD, Minecraft walking NOT TESTED, WorldWrites0, 9 BLOCKED.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: R125-C-Upper-Floor-Verified-Repair-Study
          path: ${{ runner.temp }}/r125-door-repair/
          if-no-files-found: error
          retention-days: 21
