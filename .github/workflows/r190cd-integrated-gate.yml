name: R190-CD fail-closed model-neutral integrated artifact quality review
on:
  push:
    branches: [feature/b198zr1-protected-architectural-revision]
    paths:
      - 'source/ai/r190cd-*'
      - 'scripts/r190cd-*'
      - '.github/workflows/r190cd-integrated-gate.yml'
  pull_request:
    paths:
      - 'source/ai/r190cd-*'
      - 'scripts/r190cd-*'
      - '.github/workflows/r190cd-integrated-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-architecture-rejection:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fail-closed independent quality gate with synthetic counterexamples
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
        run: node --test scripts/r190cd-integrated-quality.test.mjs scripts/r190cd-bn.test.mjs scripts/r190cd-offline-raw-review.test.mjs scripts/r190cd-bo-capture-review.test.mjs
      - name: Recompile FROZEN CC real voxels without changing source or author design
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
        run: node scripts/r190cc-source-study.mjs --out cd-base-evidence
      - name: Evaluate original design, occupancy and absence of real authored entrances
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
        run: node scripts/r190cd-review.mjs --evidence cd-base-evidence --out cd-review
      - name: Independently recalculate physical space and author route limitations
        run: python scripts/r190cd-independent-verify.py cd-base-evidence cd-review
      - name: Preserve original geometry evidence plus independent negative scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R190CD-NEGATIVE-QUALITY-REVIEW-${{ matrix.os }}
          path: |
            cd-base-evidence
            cd-review
          if-no-files-found: warn
