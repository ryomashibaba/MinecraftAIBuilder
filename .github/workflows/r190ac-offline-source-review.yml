name: R190-AC Offline Original Source Review — ZERO MODEL CALLS
on:
  push:
    branches: [feature/b198zr1-protected-architectural-revision]
    paths:
      - 'scripts/r190ac-offline-source-review.mjs'
      - 'scripts/r190ac-offline-source-review.test.mjs'
      - 'source/ai/r190ab-semantic-contract.mjs'
      - 'source/ai/r190-semantic-massing.mjs'
      - 'scripts/r190-semantic-fixtures.mjs'
      - 'evidence/r190aa/pilot-01/MODEL_RESPONSE_ORIGINAL.txt'
      - 'evidence/r190aa/pilot-01/AUDIT.json'
      - '.github/workflows/r190ac-offline-source-review.yml'
      - 'scripts/r125-r190-free-engine.mjs'
      - 'scripts/r125-r190-free-engine.test.mjs'
      - 'scripts/r125-free-build.mjs'
permissions:
  contents: read
jobs:
  fake-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check scripts/r190ac-offline-source-review.mjs
      - run: node --check scripts/r190ac-offline-source-review.test.mjs
      - run: node --test scripts/r190ac-offline-source-review.test.mjs
      - run: node scripts/r190ac-offline-source-review.mjs --help
      - name: R125 legacy and opt-in R190 to Education strict offline integration
        run: |
          node --check scripts/r125-r190-free-engine.mjs
          node --check scripts/r125-r190-free-engine.test.mjs
          node --check scripts/r125-free-build.mjs
          node --test scripts/r125-free-build.test.mjs scripts/r125-r190-free-engine.test.mjs
