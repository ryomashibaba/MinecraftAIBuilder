name: December encrypted checkpoint restore offline regression (no model)

on:
  push:
    branches:
      - research/dec-free-autonomy-solo-pilot-20261104
    paths:
      - '.github/workflows/dec-qwen4b-restore-regression.yml'

permissions:
  contents: read

jobs:
  check-restoration-with-synthetic-git:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Python, Git and OpenSSL are installed
        run: |
          python3 --version
          git --version
          openssl version
      - name: Run synthetic encrypted checkpoint restoration and reQA tests
        run: |
          python3 -m unittest discover -v -s tools/free-autonomy-solo -p 'test_restore_qwen4b_private_checkpoint.py'
      - name: Explicit scope of this evidence
        if: always()
        run: |
          echo 'Synthetic-only Python/Git/OpenSSL regressions.'
          echo 'No model, no private artifacts, no Docker QA and no automatic source publication.'

  synthetic-real-docker-recheck-no-llm:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull public QA runtime only (NO Ollama, models or credentials)
        run: docker pull node:24-bookworm-slim
      - name: ReQA an ephemeral self-created encrypted Git bundle in real isolated Docker
        run: |
          python3 - <<'PY'
          """Ephemeral synthetic Git bundle + actual Docker reQA, no model/private source."""
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import hashlib
          import io
          import json
          import os
          import subprocess
          import tarfile
          
          from restore_qwen4b_private_checkpoint import restore_checkpoint, recheck_restored_source_docker, CheckpointHold
          
          SOURCE = 'source/ai/fixture_ir.mjs'
          TEST = 'scripts/r125-v4h-mezzanine.test.mjs'
          
          def run(*args, cwd=None):
              p = subprocess.run(args, cwd=cwd, check=True, stdin=subprocess.DEVNULL,
                                 capture_output=True, timeout=90,
                                 env={**os.environ, 'GIT_CONFIG_NOSYSTEM': '1'})
              return p.stdout.decode().strip()
          
          def make_fixture(root, second_value):
              baseline = root / 'baseline'
              baseline.mkdir()
              run('git', 'init', '-q', '-b', 'research/synthetic', cwd=baseline)
              run('git', 'config', 'user.name', 'Offline CI fixture', cwd=baseline)
              run('git', 'config', 'user.email', 'fixture@example.invalid', cwd=baseline)
              source = baseline / SOURCE
              source.parent.mkdir(parents=True)
              source.write_text('export const value = 1;\n')
              test = baseline / TEST
              test.parent.mkdir(parents=True)
              test.write_text('''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { value } from '../source/ai/fixture_ir.mjs';
          test('trusted synthetic generated source', () => {
            assert.ok(Number.isInteger(value) && value >= 2 && value <= 3);
          });
          ''')
              run('git', 'add', '.', cwd=baseline)
              run('git', 'commit', '-q', '-m', 'baseline: synthetic source and test', cwd=baseline)
              base_sha = run('git', 'rev-parse', 'HEAD', cwd=baseline)
              base_blob = run('git', 'rev-parse', 'HEAD:'+SOURCE, cwd=baseline)
              work = root / 'work'
              run('git', 'clone', '-q', str(baseline), str(work))
              run('git', 'config', 'user.name', 'Offline CI fixture', cwd=work)
              run('git', 'config', 'user.email', 'fixture@example.invalid', cwd=work)
              hashes=[]
              for value in (2, second_value):
                  body=f'export const value = {value};\n'
                  (work/SOURCE).write_text(body)
                  run('git', 'add', SOURCE, cwd=work)
                  run('git', 'commit', '-q', '-m', f'synthetic staged source {value}', cwd=work)
                  hashes.append(hashlib.sha256(body.encode()).hexdigest())
              final_sha=run('git', 'rev-parse', 'HEAD', cwd=work)
              bundle=root/'fixture.bundle'
              run('git','bundle','create',str(bundle),'HEAD','^'+base_sha,cwd=work)
              run('git','bundle','verify',str(bundle),cwd=work)
              proof={'schema':'dec-qwen4b-private-encrypted-source-checkpoint-v1',
                     'scope':'RESEARCH_ONLY_SOURCE_QA_NOT_ADOPTED',
                     'base_public_commit':base_sha,'final_verified_head':final_sha,
                     'source_file':SOURCE,
                     'accepted_cycles':[{'cycle':1,'source_sha256':hashes,'qa_commands':[1,1]}],
                     'bundle_sha256':hashlib.sha256(bundle.read_bytes()).hexdigest(),
                     'game_art_approved':False,'model_code_publication_authorized':False}
              archive=root/'fixture.tar.gz'
              with tarfile.open(archive,'w:gz') as tf:
                  for name,data in [('proof.json',json.dumps(proof,sort_keys=True).encode()),
                                    ('qa-commits.bundle',bundle.read_bytes())]:
                      entry=tarfile.TarInfo(name)
                      entry.size=len(data)
                      entry.mode=0o600
                      tf.addfile(entry,io.BytesIO(data))
              cert,key=root/'cert.pem',root/'key.pem'
              run('openssl','req','-x509','-newkey','rsa:2048','-nodes',
                  '-keyout',str(key),'-out',str(cert),'-subj','/CN=DisposableSyntheticQA',
                  '-days','1')
              ciphertext=root/'checkpoint.cms'
              run('openssl','cms','-encrypt','-aes-256-gcm','-binary','-in',str(archive),
                  '-outform','DER','-out',str(ciphertext),'-recip',str(cert))
              private=root/'private'
              private.mkdir()
              receipt=restore_checkpoint(ciphertext,hashlib.sha256(ciphertext.read_bytes()).hexdigest(),
                  cert,key,baseline,private,pinned_base=base_sha,pinned_source=SOURCE,pinned_blob=base_blob)
              assert receipt['status']=='PRIVATE_QA_GIT_HISTORY_RESTORED_REVIEW_ONLY'
              assert receipt['verified_source_stages']==2
              return baseline,private,private/receipt['private_bare_repo_name'],base_sha,base_blob
          
          with TemporaryDirectory(prefix='dec-real-docker-e2e-') as directory:
              root=Path(directory)
              good=root/'positive';good.mkdir()
              base,private,bare,base_sha,base_blob=make_fixture(good,3)
              outcome=recheck_restored_source_docker(bare,base,private,pinned_base=base_sha,
                  pinned_source=SOURCE,pinned_blob=base_blob)
              assert outcome['status']=='RESTORED_REAL_DOCKER_SOURCE_REQA_ONLY_ART_HOLD',outcome
              assert outcome['qa_stages_reexecuted']==2,outcome
              assert (bare/'qa-reverification.private.json').is_file()
              assert not (base/'qa-reverification.private.json').exists()
              print('SYNTHETIC_REAL_DOCKER_POSITIVE_PASS: stages=2, no model, no publication')
          
              bad=root/'negative';bad.mkdir()
              base,private,bare,base_sha,base_blob=make_fixture(bad,99)
              try:
                  recheck_restored_source_docker(bare,base,private,pinned_base=base_sha,
                      pinned_source=SOURCE,pinned_blob=base_blob)
              except CheckpointHold as exc:
                  assert str(exc)=='CHECKPOINT_REQA_SOURCE_QA_NOT_PASSED',str(exc)
              else:
                  raise AssertionError('A failing real Docker QA was incorrectly accepted')
              assert not (bare/'qa-reverification.private.json').exists()
              print('SYNTHETIC_REAL_DOCKER_NEGATIVE_PASS: rejected failed stage, no certificate')
          PY
      - name: Explicit evidence boundary
        if: always()
        run: |
          echo 'Synthetic Git history and disposable test key only. Real Docker SOURCE QA, no LLM.'
          echo 'No PRIVATE actual Qwen artifact, no actual user code, no ART/gameplay certification.'
          echo 'No GitHub source push, main changes, or production promotion.'
