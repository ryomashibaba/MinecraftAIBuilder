name: December encrypted checkpoint restore offline regression (no model)

on:
  push:
    branches:
      - research/dec-free-autonomy-solo-pilot-20261104
    paths:
      - '.github/workflows/dec-qwen4b-restore-regression.yml'

permissions:
  contents: read

jobs:
  check-restoration-with-synthetic-git:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Python, Git and OpenSSL are installed
        run: |
          python3 --version
          git --version
          openssl version
      - name: Run synthetic encrypted checkpoint restoration and reQA tests
        run: |
          python3 -m unittest discover -v -s tools/free-autonomy-solo -p 'test_restore_qwen4b_private_checkpoint.py'
      - name: Verify genuine production sealer to restoration contract with synthetic four-stage Git
        env:
          PYTHONPATH: tools/free-autonomy-solo
        run: |
          python3 - <<'PY'
          """Synthetic 4-stage producer -> encrypted CMS -> restored bare Git roundtrip.
          NO models, no private project output, no Docker invocation or public generated code.
          """
          import hashlib
          import json
          import subprocess
          import tempfile
          from pathlib import Path
          
          from real_qwen4b_two_cumulative_ci import _verified_private_checkpoint
          from restore_qwen4b_private_checkpoint import restore_checkpoint
          
          SOURCE = 'source/ai/r125-v4h-mezzanine-author-ir.mjs'
          
          def command(*args, cwd=None):
              proc = subprocess.run(args, cwd=cwd, check=True, stdout=subprocess.PIPE,
                                    stderr=subprocess.PIPE, timeout=45, text=True)
              return proc.stdout.strip()
          
          with tempfile.TemporaryDirectory(prefix='synthetic-qwen4b-roundtrip-') as folder:
              home = Path(folder)
              base = home / 'trusted-baseline'
              base.mkdir()
              command('git', 'init', '-q', '-b', 'research/fixture', cwd=base)
              command('git', 'config', 'user.name', 'Fixture', cwd=base)
              command('git', 'config', 'user.email', 'fixture@example.invalid', cwd=base)
              target = base / SOURCE
              target.parent.mkdir(parents=True)
              target.write_text('export const fixture = 0;\n', encoding='utf-8')
              command('git', 'add', '.', cwd=base)
              command('git', 'commit', '-q', '-m', 'synthetic original', cwd=base)
              baseline_sha = command('git', 'rev-parse', 'HEAD', cwd=base)
              baseline_blob = command('git', 'rev-parse', 'HEAD:' + SOURCE, cwd=base)
          
              work = home / 'model-free-fixture'
              command('git', 'clone', '-q', str(base), str(work))
              command('git', 'config', 'user.name', 'Fixture', cwd=work)
              command('git', 'config', 'user.email', 'fixture@example.invalid', cwd=work)
              hashes, commits = [], []
              for i in range(4):
                  content = f'export const fixture = {i+1};\n'.encode()
                  (work / SOURCE).write_bytes(content)
                  command('git', 'add', SOURCE, cwd=work)
                  command('git', 'commit', '-q', '-m', f'fixture stage {i+1}', cwd=work)
                  hashes.append(hashlib.sha256(content).hexdigest())
                  commits.append(command('git', 'rev-parse', 'HEAD', cwd=work))
          
              private = home / 'PRIVATE'
              private.mkdir()
              session = private / ('m-' + 'a' * 16)
              stage = session / 'c2' / 'PrivateClones' / 'minecraftaibuilder-synthetic'
              stage.mkdir(parents=True)
              qa_clone = stage / 'qa-clone-synthetic'
              command('git', 'clone', '-q', str(work), str(qa_clone))
              review = stage / 'private-review'
              review.mkdir()
              second_base = commits[1]
              second_blob = command('git', 'rev-parse', second_base + ':' + SOURCE, cwd=qa_clone)
              (review / 'REVIEW_ONLY_PRIVATE_MANIFEST.json').write_text(json.dumps({
                  'schema': 'dec-private-source-review-after-real-qa-v1',
                  'status': 'TWO_SOURCE_STAGES_REVIEW_ONLY_ART_HOLD',
                  'human_approval': False, 'github_pushes': 0,
                  'source_file': SOURCE,
                  'project_source_commit': second_base,
                  'project_source_blob': second_blob,
              }), encoding='utf-8')
              (stage / 'SHAREABLE_PROMOTION_RESULT.json').write_text(json.dumps({
                  'qa_workspace_private': str(qa_clone),
                  'private_source_review_directory': str(review),
                  'status': 'TWO_STAGES_INDEPENDENT_DOCKER_SOURCE_QA_LOCAL_COMMITS',
                  'completed_stages': 2, 'private_source_review_stages': 2,
                  'github_pushes': 0,
                  'source_commit': second_base,
                  'source_blob': second_blob,
                  'local_qa_commits': [{'commit': commits[2]}, {'commit': commits[3]}],
              }), encoding='utf-8')
              accepted = [{'cycle': 1, 'source_sha256': hashes[:2], 'qa_commands': [1, 1]},
                          {'cycle': 2, 'source_sha256': hashes[2:], 'qa_commands': [1, 1]}]
              summary = {
                  'completed_cycles': 2, 'accepted_cycles': accepted,
                  'base_audited_public_source_commit': baseline_sha,
                  'completed_qa_source_stages': 4, 'private_review_stages': 4,
                  'github_pushes': 0, 'original_source_modified': False,
              }
              report = session / 'SHAREABLE_MAB_CUMULATIVE_SOURCE_QA.json'
              report.write_text(json.dumps(summary), encoding='utf-8')
              certificate = home / 'recipient.pem'
              private_key = home / 'private-key.pem'
              command('openssl', 'req', '-x509', '-newkey', 'rsa:2048',
                      '-keyout', str(private_key), '-out', str(certificate),
                      '-nodes', '-subj', '/CN=SyntheticCIOnly', '-days', '2')
              encrypted = home / 'checkpoint.cms'
              ciphertext_sha = _verified_private_checkpoint(
                  private, report, summary, certificate.read_text(encoding='utf-8'), encrypted)
              assert hashlib.sha256(encrypted.read_bytes()).hexdigest() == ciphertext_sha
              restored_dir = home / 'restored-private'
              restored_dir.mkdir()
              restored = restore_checkpoint(
                  encrypted, ciphertext_sha, certificate, private_key, base, restored_dir,
                  pinned_base=baseline_sha, pinned_source=SOURCE, pinned_blob=baseline_blob)
              assert restored['verified_source_stages'] == 4, restored
              assert restored['final_commit'] == commits[3], restored
              assert restored['model_requests'] == 0
              assert restored['public_git_pushes'] == 0
              print('PRODUCER_TO_CONSUMER_SYNTHETIC_FOUR_STAGE_PASS')
          
              rejected = home / 'must-not-appear.cms'
              forged = json.loads(json.dumps(summary))
              forged['accepted_cycles'][0]['source_sha256'][0] = '0' * 64
              report.write_text(json.dumps(forged), encoding='utf-8')
              try:
                  _verified_private_checkpoint(private, report, forged,
                                               certificate.read_text(encoding='utf-8'), rejected)
              except (ValueError, OSError, subprocess.SubprocessError):
                  assert not rejected.exists()
                  print('PRODUCER_TAMPERED_SOURCE_HASH_REJECTED_PASS')
              else:
                  raise AssertionError('Forged synthetic source hash was accepted')
          PY
      - name: Explicit scope of this evidence
        if: always()
        run: |
          echo 'Synthetic-only Python/Git/OpenSSL regressions.'
          echo 'No model, no private artifacts, no Docker QA and no automatic source publication.'

  synthetic-real-docker-recheck-no-llm:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull public QA runtime only (NO Ollama, models or credentials)
        run: docker pull node:24-bookworm-slim
      - name: ReQA an ephemeral self-created encrypted Git bundle in real isolated Docker
        env:
          PYTHONPATH: tools/free-autonomy-solo
        run: |
          python3 - <<'PY'
          """Ephemeral synthetic Git bundle + actual Docker reQA, no model/private source."""
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import hashlib
          import io
          import json
          import os
          import subprocess
          import tarfile
          
          from restore_qwen4b_private_checkpoint import restore_checkpoint, recheck_restored_source_docker, CheckpointHold
          
          SOURCE = 'source/ai/fixture_ir.mjs'
          TEST = 'scripts/r125-v4h-mezzanine.test.mjs'
          
          def run(*args, cwd=None):
              p = subprocess.run(args, cwd=cwd, check=True, stdin=subprocess.DEVNULL,
                                 capture_output=True, timeout=90,
                                 env={**os.environ, 'GIT_CONFIG_NOSYSTEM': '1'})
              return p.stdout.decode().strip()
          
          def make_fixture(root, second_value):
              baseline = root / 'baseline'
              baseline.mkdir()
              run('git', 'init', '-q', '-b', 'research/synthetic', cwd=baseline)
              run('git', 'config', 'user.name', 'Offline CI fixture', cwd=baseline)
              run('git', 'config', 'user.email', 'fixture@example.invalid', cwd=baseline)
              source = baseline / SOURCE
              source.parent.mkdir(parents=True)
              source.write_text('export const value = 1;\n')
              test = baseline / TEST
              test.parent.mkdir(parents=True)
              test.write_text('''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { value } from '../source/ai/fixture_ir.mjs';
          test('trusted synthetic generated source', () => {
            assert.ok(Number.isInteger(value) && value >= 2 && value <= 3);
          });
          ''')
              run('git', 'add', '.', cwd=baseline)
              run('git', 'commit', '-q', '-m', 'baseline: synthetic source and test', cwd=baseline)
              base_sha = run('git', 'rev-parse', 'HEAD', cwd=baseline)
              base_blob = run('git', 'rev-parse', 'HEAD:'+SOURCE, cwd=baseline)
              work = root / 'work'
              run('git', 'clone', '-q', str(baseline), str(work))
              run('git', 'config', 'user.name', 'Offline CI fixture', cwd=work)
              run('git', 'config', 'user.email', 'fixture@example.invalid', cwd=work)
              hashes=[]
              for value in (2, second_value):
                  body=f'export const value = {value};\n'
                  (work/SOURCE).write_text(body)
                  run('git', 'add', SOURCE, cwd=work)
                  run('git', 'commit', '-q', '-m', f'synthetic staged source {value}', cwd=work)
                  hashes.append(hashlib.sha256(body.encode()).hexdigest())
              final_sha=run('git', 'rev-parse', 'HEAD', cwd=work)
              bundle=root/'fixture.bundle'
              run('git','bundle','create',str(bundle),'HEAD','^'+base_sha,cwd=work)
              run('git','bundle','verify',str(bundle),cwd=work)
              proof={'schema':'dec-qwen4b-private-encrypted-source-checkpoint-v1',
                     'scope':'RESEARCH_ONLY_SOURCE_QA_NOT_ADOPTED',
                     'base_public_commit':base_sha,'final_verified_head':final_sha,
                     'source_file':SOURCE,
                     'accepted_cycles':[{'cycle':1,'source_sha256':hashes,'qa_commands':[1,1]}],
                     'bundle_sha256':hashlib.sha256(bundle.read_bytes()).hexdigest(),
                     'game_art_approved':False,'model_code_publication_authorized':False}
              archive=root/'fixture.tar.gz'
              with tarfile.open(archive,'w:gz') as tf:
                  for name,data in [('proof.json',json.dumps(proof,sort_keys=True).encode()),
                                    ('qa-commits.bundle',bundle.read_bytes())]:
                      entry=tarfile.TarInfo(name)
                      entry.size=len(data)
                      entry.mode=0o600
                      tf.addfile(entry,io.BytesIO(data))
              cert,key=root/'cert.pem',root/'key.pem'
              run('openssl','req','-x509','-newkey','rsa:2048','-nodes',
                  '-keyout',str(key),'-out',str(cert),'-subj','/CN=DisposableSyntheticQA',
                  '-days','1')
              ciphertext=root/'checkpoint.cms'
              run('openssl','cms','-encrypt','-aes-256-gcm','-binary','-in',str(archive),
                  '-outform','DER','-out',str(ciphertext),'-recip',str(cert))
              private=root/'private'
              private.mkdir()
              receipt=restore_checkpoint(ciphertext,hashlib.sha256(ciphertext.read_bytes()).hexdigest(),
                  cert,key,baseline,private,pinned_base=base_sha,pinned_source=SOURCE,pinned_blob=base_blob)
              assert receipt['status']=='PRIVATE_QA_GIT_HISTORY_RESTORED_REVIEW_ONLY'
              assert receipt['verified_source_stages']==2
              return baseline,private,private/receipt['private_bare_repo_name'],base_sha,base_blob
          
          with TemporaryDirectory(prefix='dec-real-docker-e2e-') as directory:
              root=Path(directory)
              good=root/'positive';good.mkdir()
              base,private,bare,base_sha,base_blob=make_fixture(good,3)
              outcome=recheck_restored_source_docker(bare,base,private,pinned_base=base_sha,
                  pinned_source=SOURCE,pinned_blob=base_blob)
              assert outcome['status']=='RESTORED_REAL_DOCKER_SOURCE_REQA_ONLY_ART_HOLD',outcome
              assert outcome['qa_stages_reexecuted']==2,outcome
              assert (bare/'qa-reverification.private.json').is_file()
              assert not (base/'qa-reverification.private.json').exists()
              print('SYNTHETIC_REAL_DOCKER_POSITIVE_PASS: stages=2, no model, no publication')
          
              bad=root/'negative';bad.mkdir()
              base,private,bare,base_sha,base_blob=make_fixture(bad,99)
              try:
                  recheck_restored_source_docker(bare,base,private,pinned_base=base_sha,
                      pinned_source=SOURCE,pinned_blob=base_blob)
              except CheckpointHold as exc:
                  assert str(exc)=='CHECKPOINT_REQA_SOURCE_QA_NOT_PASSED',str(exc)
              else:
                  raise AssertionError('A failing real Docker QA was incorrectly accepted')
              assert not (bare/'qa-reverification.private.json').exists()
              print('SYNTHETIC_REAL_DOCKER_NEGATIVE_PASS: rejected failed stage, no certificate')
          PY
      - name: Explicit evidence boundary
        if: always()
        run: |
          echo 'Synthetic Git history and disposable test key only. Real Docker SOURCE QA, no LLM.'
          echo 'No PRIVATE actual Qwen artifact, no actual user code, no ART/gameplay certification.'
          echo 'No GitHub source push, main changes, or production promotion.'
