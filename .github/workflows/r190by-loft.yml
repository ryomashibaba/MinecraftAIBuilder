name: R190-BY original author-controlled contour loft real source QA
on:
  push:
    branches: [feature/b198zr1-protected-architectural-revision]
    paths:
      - 'evidence/r190by/**'
      - 'source/ai/r190by-freeform-loft.mjs'
      - 'scripts/r190by-*'
      - '.github/workflows/r190by-loft.yml'
  pull_request:
    paths:
      - 'evidence/r190by/**'
      - 'source/ai/r190by-freeform-loft.mjs'
      - 'scripts/r190by-*'
      - '.github/workflows/r190by-loft.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: True author-loft compiler and rejection regressions (offline)
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
        run: node --test scripts/r190by-loft.test.mjs
      - name: Render each frozen author loft and validate full-source voxels
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
        run: node scripts/r190by-freeform-study.mjs --out by-evidence
      - name: Preserve source, SHA, full voxels, five views and functional HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R190BY-STRICT-LOFT-${{ matrix.os }}
          path: by-evidence
          if-no-files-found: warn
