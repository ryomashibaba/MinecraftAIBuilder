          github-token: ${{ github.token }}
          name: B156-Verified-Generated-Bridge-Candidate
          path: b158-b156-artifact/
      - name: Download verified B155 fallback for source delta
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          repository: ryomashibaba/MinecraftAIBuilder
          run-id: 38976036113
          github-token: ${{ github.token }}
          name: B155-Verified-Cross-Architecture-Bridges
          path: b157-b155-artifact/
      - name: Download verified B154 fallback for source delta
        if: steps.cache.outputs.cache-hit != 'true'
