name: Universal AI Architecture Studio B154 / Genuine Flat Bypass
on:
  # All future B-number feature branches inherited from B143 auto-publish,
  # after full offline verification and without per-branch workflow edits.
  push:
    branches:
      - 'feature/b*'
    paths:
      - 'designs/**'
      - 'source/**'
      - 'scripts/build-b142-site.mjs'
      - 'scripts/build-b143-site*'
      - 'scripts/build-b144-site*'
      - 'scripts/build-b145-site*'
      - 'scripts/build-b146-site*'
      - 'scripts/build-b147-site*'
      - 'scripts/build-b148-site*'
      - 'scripts/build-b149-site*'
      - 'scripts/build-b150-site*'
      - 'scripts/build-b151-site*'
      - 'scripts/build-b152-site*'
      - 'scripts/build-b153-site*'
      - 'scripts/build-b154-site*'
      - 'scripts/prepare-b148-baseline.mjs'
      - 'scripts/prepare-b149-baseline.mjs'
      - 'scripts/prepare-b150-baseline.mjs'
      - 'scripts/prepare-b151-baseline.mjs'
      - 'scripts/prepare-b152-baseline.mjs'
      - 'scripts/prepare-b153-baseline.mjs'
      - 'scripts/prepare-b154-baseline.mjs'
      - 'scripts/qa-b145-browser.mjs'
      - '.github/workflows/b143.yml'
  pull_request:
    paths:
      - 'designs/**'
      - 'source/**'
      - 'scripts/build-b142-site.mjs'
      - 'scripts/build-b143-site*'
      - 'scripts/build-b144-site*'
      - 'scripts/build-b145-site*'
      - 'scripts/build-b146-site*'
      - 'scripts/build-b147-site*'
      - 'scripts/build-b148-site*'
      - 'scripts/build-b149-site*'
      - 'scripts/build-b150-site*'
      - 'scripts/build-b151-site*'
      - 'scripts/build-b152-site*'
      - 'scripts/build-b153-site*'
      - 'scripts/build-b154-site*'
      - 'scripts/prepare-b148-baseline.mjs'
      - 'scripts/prepare-b149-baseline.mjs'
      - 'scripts/prepare-b150-baseline.mjs'
      - 'scripts/prepare-b151-baseline.mjs'
      - 'scripts/prepare-b152-baseline.mjs'
      - 'scripts/prepare-b153-baseline.mjs'
      - 'scripts/prepare-b154-baseline.mjs'
      - 'scripts/qa-b145-browser.mjs'
      - '.github/workflows/b143.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: b143-gallery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  design-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen reference and syntax
        run: |
          node scripts/verify-freeze.mjs
          node --check source/ai/b143-building-dsl.mjs
          node --check scripts/build-b143-site.mjs
          node --check scripts/build-b143-site.test.mjs
          node --check source/ai/b144-design-revisions.mjs
          node --check scripts/build-b144-site.mjs
          node --check scripts/build-b144-site.test.mjs
          node --check scripts/build-b145-site.mjs
          node --check scripts/build-b145-site.test.mjs
          node --check source/ai/b146-topology-review.mjs
          node --check scripts/build-b146-site.mjs
          node --check scripts/build-b146-site.test.mjs
          node --check source/ai/b147-detachment-diagnosis.mjs
          node --check scripts/build-b147-site.mjs
          node --check scripts/build-b147-site.test.mjs
          node --check source/ai/b148-repair-options.mjs
          node --check scripts/build-b148-site.mjs
          node --check scripts/build-b148-site.test.mjs
          node --check scripts/prepare-b148-baseline.mjs
          node --check source/ai/b149-traversability.mjs
          node --check scripts/build-b149-site.mjs
          node --check scripts/build-b149-site.test.mjs
          node --check scripts/prepare-b149-baseline.mjs
          node --check source/ai/b150-vertical-candidates.mjs
          node --check scripts/build-b150-site.mjs
          node --check scripts/build-b150-site.test.mjs
          node --check scripts/prepare-b150-baseline.mjs
          node --check source/ai/b151-clearance-review.mjs
          node --check scripts/build-b151-site.mjs
          node --check scripts/build-b151-site.test.mjs
          node --check scripts/prepare-b151-baseline.mjs
          node --check source/ai/b152-footprint-review.mjs
          node --check scripts/build-b152-site.mjs
          node --check scripts/build-b152-site.test.mjs
          node --check scripts/prepare-b152-baseline.mjs
          node --check source/ai/b153-transition-envelopes.mjs
          node --check scripts/build-b153-site.mjs
          node --check scripts/build-b153-site.test.mjs
          node --check scripts/prepare-b153-baseline.mjs
          node --check source/ai/b154-bypass-evidence.mjs
          node --check scripts/build-b154-site.mjs
          node --check scripts/build-b154-site.test.mjs
          node --check scripts/prepare-b154-baseline.mjs
          node --check scripts/qa-b145-browser.mjs
      - name: New-purpose 3D geometry, replay, injection guards, blocked construction tests
        run: |
          node --test scripts/build-b143-site.test.mjs
          node --test scripts/build-b144-site.test.mjs
          node --test scripts/build-b145-site.test.mjs
          node --test scripts/build-b146-site.test.mjs
          node --test scripts/build-b147-site.test.mjs
          node --test scripts/build-b148-site.test.mjs
          node --test scripts/build-b149-site.test.mjs
          node --test scripts/build-b150-site.test.mjs
          node --test scripts/build-b151-site.test.mjs
          node --test scripts/build-b152-site.test.mjs
          node --test scripts/build-b153-site.test.mjs
          node --test scripts/build-b154-site.test.mjs
  b143-site:
    needs: design-validation
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen B100 source and construction invariant
        run: node scripts/verify-freeze.mjs
      - name: Exact-input B154 cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            b142-site-output/
            b141-review-output/
            b154-build-evidence/
          key: b154-node22-${{ runner.os }}-${{ hashFiles('source/**','designs/ai/**','scripts/build-b142-site.mjs','scripts/build-b143-site.mjs','scripts/build-b144-site.mjs','scripts/build-b145-site.mjs','scripts/build-b146-site.mjs','scripts/build-b147-site.mjs','scripts/build-b148-site.mjs','scripts/prepare-b148-baseline.mjs','source/ai/b149-traversability.mjs','scripts/build-b149-site.mjs','scripts/build-b149-site.test.mjs','scripts/prepare-b149-baseline.mjs','source/ai/b150-vertical-candidates.mjs','scripts/build-b150-site.mjs','scripts/build-b150-site.test.mjs','scripts/prepare-b150-baseline.mjs','source/ai/b151-clearance-review.mjs','scripts/build-b151-site.mjs','scripts/build-b151-site.test.mjs','scripts/prepare-b151-baseline.mjs','source/ai/b152-footprint-review.mjs','scripts/build-b152-site.mjs','scripts/build-b152-site.test.mjs','scripts/prepare-b152-baseline.mjs','source/ai/b153-transition-envelopes.mjs','scripts/build-b153-site.mjs','scripts/build-b153-site.test.mjs','scripts/prepare-b153-baseline.mjs','source/ai/b154-bypass-evidence.mjs','scripts/build-b154-site.mjs','scripts/build-b154-site.test.mjs','scripts/prepare-b154-baseline.mjs','scripts/build-b148-site.test.mjs','scripts/qa-b145-browser.mjs','scripts/verify-freeze.mjs') }}
      - name: Download B153 predecessor artifact when available
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          repository: ryomashibaba/MinecraftAIBuilder
          run-id: 38974274194
          github-token: ${{ github.token }}
          name: B154-Verified-Flat-Bypass
          path: .
      - name: Download verified B152 fallback for source delta
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          repository: ryomashibaba/MinecraftAIBuilder
          run-id: 38972999079
          github-token: ${{ github.token }}
          name: B152-Verified-Footprint-Gallery
          path: b154-b152-artifact/
      - name: Download verified B151 fallback for source delta
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          repository: ryomashibaba/MinecraftAIBuilder
          run-id: 38972077307
          github-token: ${{ github.token }}
          name: B151-Verified-Corridor-Clearance
          path: b153-b151-artifact/
      - name: Download verified B150 fallback for efficient delta rebuild
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          repository: ryomashibaba/MinecraftAIBuilder
          run-id: 38970418390
          github-token: ${{ github.token }}
          name: B150-Verified-Vertical-Circulation
          path: b152-b150-artifact/
      - name: Download immutable B148 fallback for delta-only regeneration
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          repository: ryomashibaba/MinecraftAIBuilder
          run-id: 38915321401
          github-token: ${{ github.token }}
          name: B148-Verified-Repair-Proposals-And-Incremental-Source
          path: b150-b148-artifact/
      - name: Validate B153 provenance or source-rebuild, then build B154 delta
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          node scripts/prepare-b154-baseline.mjs
          node scripts/build-b154-site.mjs
      - name: Verify B142 through B154 recursively once and construction HOLD
        run: |
          node scripts/build-b154-site.mjs --verify
          node --input-type=module -e "
          import fs from 'node:fs';
          import {verifyB141} from './source/parallel/b141/main/b141-integrated-network.mjs';
          const b=JSON.parse(fs.readFileSync('b141-review-output/B141_15Buildings_Shared_2Wide_Network.json'));
          const p=JSON.parse(fs.readFileSync('b142-site-output/B154_MANIFEST.json'));
          const v=JSON.parse(fs.readFileSync('b154-build-evidence/B154_BASELINE_PATH.json'));
          if(!verifyB141(b)||b.readiness!=='NOT_PREPARED'||b.gates.length!==9||
             b.gates.some(x=>x.status!=='BLOCKED')||b.BuildPlan.operations.length!==0||
             p.constructionApproved!==false||p.worldWrites!==0||
             p.stairsCertified!==false||p.playerCollisionCertified!==false||
             p.oldStatus!=='INVALID_GOAL_FOOTPRINT'||
             p.newStatus!=='PASS_FLAT_FOOTPRINT_GEOMETRY'||
             p.newRouteSteps!==26||p.realAddedVoxels<=0||
             p.inheritedB141Sha256!==b.integritySha256||
             v.status!=='PASS'||v.constructionApproved!==false||v.worldWrites!==0)
            throw Error('B154_CONSTRUCTION_OR_INTEGRITY_HOLD');
          console.log('B154_ACTUAL_SUPPORTED_BYPASS_HOLD_PASS');
          "
      - name: Evidence summary
        run: |
          echo '## B143 new-purpose architectural models' >> "$GITHUB_STEP_SUMMARY"
          echo '- ChatGPT-authored category-free DSL designs and B144 source-pinned revisions' >> "$GITHUB_STEP_SUMMARY"
          echo '- Composition: boxes, ellipsoids, cylinders, toruses, diagonal beams and subtractive voids' >> "$GITHUB_STEP_SUMMARY"
          echo '- 16 historical models preserved plus R6 real lower bypass: 17 model scenes' >> "$GITHUB_STEP_SUMMARY"
          echo '- Real supported width-4 lower bypass: 2x2 full-cell geometry passes in 26 flat moves with zero elevation change' >> "$GITHUB_STEP_SUMMARY"
          echo '- R4 390 detached; saved R5 and both B148 options 0 locally detached' >> "$GITHUB_STEP_SUMMARY"
          echo '- No commands, no world coordinates, no actual construction' >> "$GITHUB_STEP_SUMMARY"
          echo '- B141 source hash and 9/9 BLOCKED gates validated before publication' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: B154-Verified-Flat-Bypass
          path: |
            b142-site-output/
            b141-review-output/
            b154-build-evidence/
          if-no-files-found: error
          retention-days: 21
      - name: Upload verified Pages site
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: b142-site-output/
  browser-qa:
    needs: b143-site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the exact previously verified site artifact
        uses: actions/download-artifact@v4
        with:
          name: B154-Verified-Flat-Bypass
          path: .
      - name: Install pinned Playwright runtime without changing repository lockfiles
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate rendered Canvas and interactive 3D on desktop/mobile Chromium
        run: node scripts/qa-b145-browser.mjs
      - name: Retain actual Chromium screenshot and interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B154-Chromium-Visual-QA
          path: b145-browser-evidence/
          if-no-files-found: warn
          retention-days: 21

  deploy:
    if: ${{ github.event_name == 'push' }}
    needs: [b143-site, browser-qa]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
