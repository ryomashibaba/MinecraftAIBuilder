  b143-site:
    needs: design-validation
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen B100 source and construction invariant
        run: node scripts/verify-freeze.mjs
      - name: Exact-input B162 cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            b142-site-output/
            b141-review-output/
            b162-build-evidence/
          key: b162-node22-${{ runner.os }}-${{ hashFiles('source/**','designs/ai/**','scripts/build-b142-site.mjs','scripts/build-b143-site.mjs','scripts/build-b144-site.mjs','scripts/build-b145-site.mjs','scripts/build-b146-site.mjs','scripts/build-b147-site.mjs','scripts/build-b148-site.mjs','scripts/prepare-b148-baseline.mjs','source/ai/b149-traversability.mjs','scripts/build-b149-site.mjs','scripts/build-b149-site.test.mjs','scripts/prepare-b149-baseline.mjs','source/ai/b150-vertical-candidates.mjs','scripts/build-b150-site.mjs','scripts/build-b150-site.test.mjs','scripts/prepare-b150-baseline.mjs','source/ai/b151-clearance-review.mjs','scripts/build-b151-site.mjs','scripts/build-b151-site.test.mjs','scripts/prepare-b151-baseline.mjs','source/ai/b152-footprint-review.mjs','scripts/build-b152-site.mjs','scripts/build-b152-site.test.mjs','scripts/prepare-b152-baseline.mjs','source/ai/b153-transition-envelopes.mjs','scripts/build-b153-site.mjs','scripts/build-b153-site.test.mjs','scripts/prepare-b153-baseline.mjs','source/ai/b154-bypass-evidence.mjs','scripts/build-b154-site.mjs','scripts/build-b154-site.test.mjs','scripts/prepare-b154-baseline.mjs','source/ai/b155-bridge-proposal.mjs','scripts/build-b155-site.mjs','scripts/build-b155-site.test.mjs','scripts/prepare-b155-baseline.mjs','source/ai/b156-candidate-proof.mjs','scripts/build-b156-site.mjs','scripts/build-b156-site.test.mjs','scripts/prepare-b156-baseline.mjs','source/ai/b157-finished-bridge.mjs','scripts/build-b157-site.mjs','scripts/build-b157-site.test.mjs','scripts/prepare-b157-baseline.mjs','source/ai/b158-axis-transfer.mjs','scripts/build-b158-site.mjs','scripts/build-b158-site.test.mjs','scripts/prepare-b158-baseline.mjs','source/ai/b159-bent-skybridge.mjs','scripts/build-b159-site.mjs','scripts/build-b159-site.test.mjs','scripts/prepare-b159-baseline.mjs','source/ai/b160-multiturn-router.mjs','scripts/build-b160-site.mjs','scripts/build-b160-site.test.mjs','scripts/prepare-b160-baseline.mjs','source/ai/b161-adaptive-skybridge.mjs','scripts/build-b161-site.mjs','scripts/build-b161-site.test.mjs','scripts/prepare-b161-baseline.mjs','source/ai/b162-revision-replan.mjs','scripts/build-b162-site.mjs','scripts/build-b162-site.test.mjs','scripts/prepare-b162-baseline.mjs','scripts/build-b148-site.test.mjs','scripts/qa-b145-browser.mjs','scripts/verify-freeze.mjs') }}
      - name: Download B161 predecessor artifact when available
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          repository: ryomashibaba/MinecraftAIBuilder
          run-id: 38987860488
          github-token: ${{ github.token }}
          name: B161-Verified-Adaptive-Astar
