        uses: actions/download-artifact@v4
        with:
          repository: ryomashibaba/MinecraftAIBuilder
          run-id: 38972077307
          github-token: ${{ github.token }}
          name: B151-Verified-Corridor-Clearance
          path: b153-b151-artifact/
      - name: Download verified B150 fallback for efficient delta rebuild
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          repository: ryomashibaba/MinecraftAIBuilder
          run-id: 38970418390
          github-token: ${{ github.token }}
          name: B150-Verified-Vertical-Circulation
          path: b152-b150-artifact/
      - name: Download immutable B148 fallback for delta-only regeneration
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          repository: ryomashibaba/MinecraftAIBuilder
          run-id: 38915321401
          github-token: ${{ github.token }}
          name: B148-Verified-Repair-Proposals-And-Incremental-Source
          path: b150-b148-artifact/
      - name: Validate B161 provenance or source-rebuild, then build B162 delta
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          node scripts/prepare-b162-baseline.mjs
          node scripts/build-b162-site.mjs
      - name: Verify B142 through B162 recursively once and construction HOLD
        run: |
          node scripts/build-b162-site.mjs --verify
          node --input-type=module -e "
          import fs from 'node:fs';
          import {verifyB141} from './source/parallel/b141/main/b141-integrated-network.mjs';
          const b=JSON.parse(fs.readFileSync('b141-review-output/B141_15Buildings_Shared_2Wide_Network.json'));
          const p=JSON.parse(fs.readFileSync('b142-site-output/B162_MANIFEST.json'));
          const v=JSON.parse(fs.readFileSync('b162-build-evidence/B162_BASELINE_PATH.json'));
          if(!verifyB141(b)||b.readiness!=='NOT_PREPARED'||b.gates.length!==9||
             b.gates.some(x=>x.status!=='BLOCKED')||b.BuildPlan.operations.length!==0||
             p.constructionApproved!==false||p.worldWrites!==0||
             p.playerCollisionCertified!==false||p.structuralStrengthCertified!==false||
             p.oldRouteMoves!==101||p.newRouteMoves!==113||
             p.staleObstructedAnchors<=0||p.repairedObstructedAnchors!==0||
             p.replanBends!==4||p.newFloorSegments!==5||
             p.inheritedB141Sha256!==b.integritySha256||
             v.status!=='PASS'||v.constructionApproved!==false||v.worldWrites!==0)
            throw Error('B162_CONSTRUCTION_OR_INTEGRITY_HOLD');
          console.log('B162_REVISED_SKYPORT_SOURCE_HOLD_PASS');
          "
      - name: Evidence summary
        run: |
          echo '## B143 new-purpose architectural models' >> "$GITHUB_STEP_SUMMARY"
          echo '- ChatGPT-authored category-free DSL designs and B144 source-pinned revisions' >> "$GITHUB_STEP_SUMMARY"
          echo '- Composition: boxes, ellipsoids, cylinders, toruses, diagonal beams and subtractive voids' >> "$GITHUB_STEP_SUMMARY"
          echo '- 28 historic source-pinned scenes plus altered docking terminal and newly generated R3 skybridge: 30 scenes' >> "$GITHUB_STEP_SUMMARY"
          echo '- A new obstruction blocks the verified 101-step R2; the new source is recompiled and A* reconstructs a distinct 113-step R3 with no obstructed body anchors; zero writes' >> "$GITHUB_STEP_SUMMARY"
          echo '- R4 390 detached; saved R5 and both B148 options 0 locally detached' >> "$GITHUB_STEP_SUMMARY"
          echo '- No commands, no world coordinates, no actual construction' >> "$GITHUB_STEP_SUMMARY"
          echo '- B141 source hash and 9/9 BLOCKED gates validated before publication' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: B162-Verified-Revision-Reroute
          path: |
            b142-site-output/
            b141-review-output/
            b162-build-evidence/
          if-no-files-found: error
          retention-days: 21
      - name: Upload verified Pages site
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: b142-site-output/
  browser-qa:
    needs: b143-site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the exact previously verified site artifact
        uses: actions/download-artifact@v4
        with:
          name: B162-Verified-Revision-Reroute
          path: .
      - name: Install pinned Playwright runtime without changing repository lockfiles
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate rendered Canvas and interactive 3D on desktop/mobile Chromium
        run: node scripts/qa-b145-browser.mjs
      - name: Retain actual Chromium screenshot and interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B162-Chromium-Visual-QA
          path: b145-browser-evidence/
          if-no-files-found: warn
          retention-days: 21

  deploy:
    if: ${{ github.event_name == 'push' }}
    needs: [b143-site, browser-qa]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
