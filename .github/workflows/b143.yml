          path: b156-b154-artifact/
      - name: Download verified B153 fallback for source delta
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          repository: ryomashibaba/MinecraftAIBuilder
          run-id: 38974274194
          github-token: ${{ github.token }}
          name: B153-Verified-Transition-Envelopes
          path: b155-b153-artifact/
      - name: Download verified B152 fallback for source delta
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          repository: ryomashibaba/MinecraftAIBuilder
          run-id: 38972999079
          github-token: ${{ github.token }}
          name: B152-Verified-Footprint-Gallery
