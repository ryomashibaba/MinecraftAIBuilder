name: R44 v2 Isolated Offline Installer and R190-AG Integration
on:
  push:
    branches: [feature/b198zr1-protected-architectural-revision]
    paths:
      - 'tools/r44-v2-offline/**'
      - 'scripts/r44v2-*'
      - 'source/ai/r190ag-*'
      - 'source/ai/r190ah-*'
      - 'source/ai/r190aj-*'
      - 'scripts/r190ag-*'
      - 'scripts/r190ah-*'
      - 'scripts/r190aj-*'
      - 'source/ai/r190af-program-intent.mjs'
      - 'source/ai/r190-semantic-massing.mjs'
      - 'source/ai/r190-request-coverage.mjs'
      - '.github/workflows/r44v2-r190ag-offline.yml'
  pull_request:
    paths:
      - 'tools/r44-v2-offline/**'
      - 'scripts/r44v2-*'
      - 'source/ai/r190ag-*'
      - 'source/ai/r190ah-*'
      - 'source/ai/r190aj-*'
      - 'scripts/r190ag-*'
      - 'scripts/r190ah-*'
      - 'scripts/r190aj-*'
      - 'source/ai/r190af-program-intent.mjs'
      - 'source/ai/r190-semantic-massing.mjs'
      - 'source/ai/r190-request-coverage.mjs'
      - '.github/workflows/r44v2-r190ag-offline.yml'
permissions:
  contents: read
jobs:
  offline-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare historical Git objects only; no installer or model execution
        run: git fetch --no-tags --depth=1 origin a0438d8fa2504564351f8ebafbe9ecc14575dc95 44108944d0d9b0f892d01729c3fa3c76d006fe55 539daac020143efe2f24f981727f8dc5d6beeb50
      - name: All subsequent installer and integration tests use local files only
        run: node --test scripts/r44v2-offline-install.test.mjs scripts/r44-pinned-path-audit.test.mjs scripts/r190ag-integrated-proposals.test.mjs scripts/r190ah-meaning-audit.test.mjs scripts/r190aj-model-intent.test.mjs scripts/r190af-program-intent.test.mjs scripts/r190-semantic-massing.test.mjs
      - name: Existing AB AD AE contracts and saved-original diagnostics (synthetic fake only)
        run: node --test scripts/r190ab-structured-output-pilot.test.mjs scripts/r190ab-saved-semantic-replay.test.mjs scripts/r190ad-expressive-semantic.test.mjs scripts/r190ad-saved-semantic-diagnose.test.mjs scripts/r190ae-flexible-semantic.test.mjs scripts/r190ae-saved-semantic-diagnose.test.mjs
      - name: Emit unapproved synthetic true 3D and five views, never infer a model
        shell: pwsh
        run: node scripts/r190ag-offline-comparison.mjs --synthetic --out (Join-Path (Get-Location) 'r190ag-ci-comparison')
      - uses: actions/upload-artifact@v4
        with:
          name: R190AG-SYNTHETIC-ART-HOLD-${{ matrix.os }}
          path: r190ag-ci-comparison/
      - name: R190-AI opt-in second solver layout to genuine B143 previews
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/r190ag-offline-comparison.mjs --synthetic --out "$GITHUB_WORKSPACE/r190ai-variant-comparison" --layout-variants 2
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AI-SYNTHETIC-SECOND-LAYOUT-ART-HOLD
          path: r190ai-variant-comparison/
