name: R44 v2 Isolated Offline Installer and R190-AG Integration
on:
  push:
    branches: [feature/b198zr1-protected-architectural-revision]
    paths:
      - 'tools/r44-v2-offline/**'
      - 'scripts/r44v2-*'
      - 'source/ai/r190ag-*'
      - 'source/ai/r190ah-*'
      - 'source/ai/r190aj-*'
      - 'scripts/r190ag-*'
      - 'scripts/r190ah-*'
      - 'scripts/r190aj-*'
      - 'scripts/r190al-*'
      - 'scripts/r190am-*'
      - 'scripts/r190an-*'
      - 'scripts/r190ao-*'
      - 'scripts/r190ap-*'
      - 'scripts/r190aq-*'
      - 'source/ai/r190aq-*'
      - 'scripts/r190ar-*'
      - 'source/ai/r190ar-*'
      - 'scripts/r190as-*'
      - 'source/ai/r190as-*'
      - 'scripts/r190at-*'
      - 'source/ai/r190at-*'
      - 'scripts/r190au-*'
      - 'source/ai/r190au-*'
      - 'scripts/r190av-*'
      - 'scripts/r190aw-*'
      - 'scripts/r190ax-*'
      - 'scripts/r190ay-*'
      - 'scripts/r190az-*'
      - 'source/ai/r190af-program-intent.mjs'
      - 'source/ai/r190-semantic-massing.mjs'
      - 'source/ai/r190-request-coverage.mjs'
      - '.github/workflows/r44v2-r190ag-offline.yml'
  pull_request:
    paths:
      - 'tools/r44-v2-offline/**'
      - 'scripts/r44v2-*'
      - 'source/ai/r190ag-*'
      - 'source/ai/r190ah-*'
      - 'source/ai/r190aj-*'
      - 'scripts/r190ag-*'
      - 'scripts/r190ah-*'
      - 'scripts/r190aj-*'
      - 'scripts/r190al-*'
      - 'scripts/r190am-*'
      - 'scripts/r190an-*'
      - 'scripts/r190ao-*'
      - 'scripts/r190ap-*'
      - 'scripts/r190aq-*'
      - 'source/ai/r190aq-*'
      - 'scripts/r190ar-*'
      - 'source/ai/r190ar-*'
      - 'scripts/r190as-*'
      - 'source/ai/r190as-*'
      - 'scripts/r190at-*'
      - 'source/ai/r190at-*'
      - 'scripts/r190au-*'
      - 'source/ai/r190au-*'
      - 'scripts/r190av-*'
      - 'scripts/r190aw-*'
      - 'scripts/r190ax-*'
      - 'scripts/r190ay-*'
      - 'scripts/r190az-*'
      - 'source/ai/r190af-program-intent.mjs'
      - 'source/ai/r190-semantic-massing.mjs'
      - 'source/ai/r190-request-coverage.mjs'
      - '.github/workflows/r44v2-r190ag-offline.yml'
permissions:
  contents: read
jobs:
  offline-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare historical Git objects only; no installer or model execution
        run: git fetch --no-tags --depth=1 origin a0438d8fa2504564351f8ebafbe9ecc14575dc95 44108944d0d9b0f892d01729c3fa3c76d006fe55 539daac020143efe2f24f981727f8dc5d6beeb50
      - name: All subsequent installer and integration tests use local files only
        run: node --test scripts/r44v2-offline-install.test.mjs scripts/r44-pinned-path-audit.test.mjs scripts/r190ag-integrated-proposals.test.mjs scripts/r190ah-meaning-audit.test.mjs scripts/r190aj-model-intent.test.mjs scripts/r190al-entrance-orientation.test.mjs scripts/r190al-entrance-visual-comparison.test.mjs scripts/r190am-author-layout.test.mjs scripts/r190an-sky-court.test.mjs scripts/r190ao-open-court-mouth.test.mjs scripts/r190ap-macro-contrast.test.mjs scripts/r190aq-architectural-parti.test.mjs scripts/r190ar-structure-audit.test.mjs scripts/r190as-integrated-architecture.test.mjs scripts/r190at-functional-zones.test.mjs scripts/r190au-mandatory-forum.test.mjs scripts/r190av-arcade.test.mjs scripts/r190aw-preserved-architect-intake.test.mjs scripts/r190ax-original-output-contract-study.test.mjs scripts/r190ay-source-claim-crosscheck.test.mjs scripts/r190az-physical-claims.test.mjs scripts/r190af-program-intent.test.mjs scripts/r190-semantic-massing.test.mjs
      - name: Existing AB AD AE contracts and saved-original diagnostics (synthetic fake only)
        run: node --test scripts/r190ab-structured-output-pilot.test.mjs scripts/r190ab-saved-semantic-replay.test.mjs scripts/r190ad-expressive-semantic.test.mjs scripts/r190ad-saved-semantic-diagnose.test.mjs scripts/r190ae-flexible-semantic.test.mjs scripts/r190ae-saved-semantic-diagnose.test.mjs
      - name: Emit unapproved synthetic true 3D and five views, never infer a model
        shell: pwsh
        run: node scripts/r190ag-offline-comparison.mjs --synthetic --out (Join-Path (Get-Location) 'r190ag-ci-comparison')
      - uses: actions/upload-artifact@v4
        with:
          name: R190AG-SYNTHETIC-ART-HOLD-${{ matrix.os }}
          path: r190ag-ci-comparison/
      - name: R190-AI opt-in second solver layout to genuine B143 previews
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/r190ag-offline-comparison.mjs --synthetic --out "$GITHUB_WORKSPACE/r190ai-variant-comparison" --layout-variants 2
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AI-SYNTHETIC-SECOND-LAYOUT-ART-HOLD
          path: r190ai-variant-comparison/

      - name: R190-AL emit 4 model-authored orientation studies with true B143 views
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/r190al-entrance-visual-comparison.mjs --out "$GITHUB_WORKSPACE/r190al-entry-gallery"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AL-FOUR-DIRECTION-TRUE-B143-ART-HOLD
          path: r190al-entry-gallery/

      - name: R190-AM true B143 synthetic authored-offset massing comparison
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/r190am-author-layout-gallery.mjs --out "$GITHUB_WORKSPACE/r190am-massing-gallery"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AM-LOCKED-MASSING-TRUE-B143-ART-HOLD
          path: r190am-massing-gallery/

      - name: R190-AN native open-sky void massing B143 comparison
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/r190an-sky-court-gallery.mjs --out "$GITHUB_WORKSPACE/r190an-sky-court-gallery"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AN-TRUE-B143-SKY-COURT-SYNTHETIC-ART-HOLD
          path: r190an-sky-court-gallery/

      - name: R190-AO true B143 open exterior U court comparison
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/r190ao-exterior-court-gallery.mjs --out "$GITHUB_WORKSPACE/r190ao-exterior-court"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AO-TRUE-B143-EXTERIOR-U-COURT-ART-HOLD
          path: r190ao-exterior-court/

      - name: R190-AP multi-wing macro silhouette true B143 contrast
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/r190ap-macro-contrast.mjs --out "$GITHUB_WORKSPACE/r190ap-macro-contrast"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AP-OPEN-COURT-MULTI-WING-TRUE-B143-ART-HOLD
          path: r190ap-macro-contrast/

      - name: R190-AQ free authored macro mass void and actual B143 source gallery
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/r190aq-parti-gallery.mjs --out "$GITHUB_WORKSPACE/r190aq-parti-gallery"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AQ-AUTHORED-PARTI-TRUE-B143-SYNTHETIC-ART-HOLD
          path: r190aq-parti-gallery/

      - name: R190-AR true B143 floating structure review and architect-provided support
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/r190ar-structural-review.mjs --out "$GITHUB_WORKSPACE/r190ar-structure-study"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AR-STRUCTURE-CONTACT-TRUE-B143-ART-HOLD
          path: r190ar-structure-study/

      - name: R190-AS co-designed mass-void-support SOURCE B143 comparison
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/r190as-integrated-gallery.mjs --out "$GITHUB_WORKSPACE/r190as-co-designed-gallery"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AS-CO-DESIGNED-TRUE-B143-ART-HOLD
          path: r190as-co-designed-gallery/

      - name: R190-AT true B143 non-pod architecture and functional-zones contrast
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/r190at-gallery.mjs --out "$GITHUB_WORKSPACE/r190at-source-gallery"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AT-NONPOD-SHELTERED-PUBLIC-SOURCE-B143-ART-HOLD
          path: r190at-source-gallery/

      - name: R190-AU source-prove mandatory sky forum in every two-wide arrival to exhibition route
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/r190au-civic-route-gallery.mjs --out "$GITHUB_WORKSPACE/r190au-civic-route-gallery"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AU-REQUIRED-CIVIC-SKY-ROUTE-TRUE-B143-ART-HOLD
          path: r190au-civic-route-gallery/

      - name: R190-AV author-open arcade B143 true 3D macro facade study
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/r190av-arcade-gallery.mjs --out "$GITHUB_WORKSPACE/r190av-arcade"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AV-SOURCE-OPEN-ARCADE-TRUE-B143-ART-HOLD
          path: r190av-arcade/

      - name: R190-AX saved R190-AA original - diagnose syntax, NEVER call model or repair architecture
        if: matrix.os == 'ubuntu-24.04'
        run: >
          node scripts/r190ax-original-output-contract-study.mjs
          --original "$GITHUB_WORKSPACE/evidence/r190aa/pilot-01/MODEL_RESPONSE_ORIGINAL.txt"
          --out "$GITHUB_WORKSPACE/r190ax-contract-only"
          --sha 0bf706181bb2b7a30f8082f896a703c33749ba55f75d42010adba88f47c84f17
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AX-PRESERVED-R190AA-ONLY-DERIVED-DIAGNOSIS-NO-MODEL
          path: r190ax-contract-only/

      - name: R190-AY offline original source-level architectural contradiction audit
        if: matrix.os == 'ubuntu-24.04'
        run: >
          node scripts/r190ay-source-claim-crosscheck.mjs
          --original "$GITHUB_WORKSPACE/evidence/r190aa/pilot-01/MODEL_RESPONSE_ORIGINAL.txt"
          --out "$GITHUB_WORKSPACE/r190ay-readonly-claims"
          --sha 0bf706181bb2b7a30f8082f896a703c33749ba55f75d42010adba88f47c84f17
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AY-REAL-QWEN-SOURCE-CLAIM-EVIDENCE-NO-3D-ART-HOLD
          path: r190ay-readonly-claims/

      - name: R190-AZ exact saved model original physical claims evidence, no model run
        if: matrix.os == 'ubuntu-24.04'
        run: >
          node scripts/r190az-physical-claims.mjs
          --original "$GITHUB_WORKSPACE/evidence/r190aa/pilot-01/MODEL_RESPONSE_ORIGINAL.txt"
          --out "$GITHUB_WORKSPACE/r190az-original-proof"
          --sha 0bf706181bb2b7a30f8082f896a703c33749ba55f75d42010adba88f47c84f17
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: R190AZ-SAVED-MODEL-REAL-SOURCE-EVIDENCE-ART-HOLD
          path: r190az-original-proof/
