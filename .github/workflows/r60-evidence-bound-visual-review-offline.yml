permissions:
  contents: read
jobs:
  offline-visual-architecture-review:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 90 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: R96 fast source-geometry, provenance rejection and review wiring smoke (push / PR)
        if: github.event_name != 'workflow_dispatch'
        run: |
          node --test --test-concurrency=2 scripts/b198zr96-critical-offline-smoke.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R97 projection: source mesh only" scripts/b198zr97-multiview-mesh-review.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R98 quick: loft has smooth bounded upper-shell field" scripts/b198zr98-elevated-right-crown.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R99 quick: 3 lateral floor/overhead rays" scripts/b198zr99-finite-volume-route-witness.test.mjs
          node --test --test-concurrency=2 scripts/b198zr101-route-coverage-regression.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R102 quick: tapered shoulders" scripts/b198zr102-tapered-gallery-aprons.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R103 quick: real source edges" scripts/b198zr103-source-junction-integrity.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R104 quick: new ramp shoulders" scripts/b198zr104-r91-active-throat-repair.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R105 quick: choose only an independently witnessed" scripts/b198zr105-active-r91-throat-width-selection.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R106 quick: isolate seven actual table facets" scripts/b198zr106-reading-table-doorway-reflow.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R107 quick: source-bound compact real table" scripts/b198zr107-compact-reading-table-recovery.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R108 quick: cite real triangle kinds" scripts/b198zr108-r91-right-lane-hit-triage.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R109 quick: only exact existing floor layers" scripts/b198zr109-realfloor-referenced-r91-route.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R110 quick: finite stable nine-station profile" scripts/b198zr110-source-contoured-right-room-approach.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R111 quick: cannot change furniture" scripts/b198zr111-reversible-floor-finish-transition.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R112 quick: sculpt a continuous two-triangle eave" scripts/b198zr112-lantern-canopy-clearance.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R100 quick: actual shoulder triangles cure" scripts/b198zr100-source-gallery-shoulders.test.mjs
          node --test --test-concurrency=2 --test-name-pattern="R60 refuses corrupt original SHA|R60 refuses a synthetic R48|R89 deterministic planar length|R95 clipped wall subtracts true surface area|R96 requires actual shell source points" scripts/b198zr60-evidence-bound-visual-review.test.mjs scripts/b198zr84-multilevel-bookstack-review.test.mjs scripts/b198zr95-atrium-daylight-portals.test.mjs scripts/b198zr96-window-structure-and-light-study.test.mjs
      - name: R112 one-time real R93 lantern eave optimization
        if: github.event_name != 'workflow_dispatch'
        run: |
          node --test --test-concurrency=2 --test-name-pattern="R112 real: conservatively retreat offending R93 lantern" scripts/b198zr112-lantern-canopy-clearance.test.mjs
      - name: Full R58-R96 offline historical regression (manual workflow dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: node --test --test-concurrency=2 scripts/b198zr60-evidence-bound-visual-review.test.mjs scripts/b198zr61-final-voxel-section-review.test.mjs scripts/b198zr62-evidence-backed-revision-guidance.test.mjs scripts/b198zr63-architectural-continuity-watch.test.mjs scripts/b198zr64-unclaimed-floor-connectivity.test.mjs scripts/b198zr65-independent-network-feedback.test.mjs scripts/b198zr66-overhead-space-audit.test.mjs scripts/b198zr67-spatial-containment-audit.test.mjs scripts/b198zr68-horizontal-air-continuity.test.mjs scripts/b198zr69-vertical-air-vs-motion.test.mjs scripts/b198zr70-exterior-approach-route-review.test.mjs scripts/b198zr71-abstract-route-gap-triage.test.mjs scripts/b198zr72-mass-void-gap-context.test.mjs scripts/b198zr73-preserve-concept-circulation-comparison.test.mjs scripts/b198zr74-human-option-review-worksheet.test.mjs scripts/b198zr75-human-review-handoff.test.mjs scripts/b198zr76-architecture-next-decisions.test.mjs scripts/b198zr77-cohesive-architecture-revision-brief.test.mjs scripts/b198zr78-spatial-program-design-spec.test.mjs scripts/b198zr79-parametric-library-massing.test.mjs scripts/b198zr80-supported-route-concept-study.test.mjs scripts/b198zr81-envelope-portal-connection-review.test.mjs scripts/b198zr82-mesh-clearance-and-terrace-audit.test.mjs scripts/b198zr83-wing-terrace-landing-prototypes.test.mjs scripts/b198zr84-multilevel-bookstack-review.test.mjs scripts/b198zr85-wing-route-alternatives.test.mjs scripts/b198zr86-finite-width-deck-study.test.mjs scripts/b198zr87-seven-room-architecture.test.mjs scripts/b198zr88-gallery-circulation-study.test.mjs scripts/b198zr89-gallery-interface-architecture.test.mjs scripts/b198zr90-source-surface-seams.test.mjs scripts/b198zr91-tapered-gallery-turnout.test.mjs scripts/b198zr92-whole-library-circulation-atlas.test.mjs scripts/b198zr93-contiguous-reading-arcades.test.mjs scripts/b198zr94-seven-room-entry-redesign.test.mjs scripts/b198zr95-atrium-daylight-portals.test.mjs scripts/b198z