      - '.github/workflows/r60-evidence-bound-visual-review-offline.yml'
permissions:
  contents: read
jobs:
  offline-visual-architecture-review:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: R60 plus R59 R58 offline regression
        run: node --test scripts/b198zr60-evidence-bound-visual-review.test.mjs scripts/b198zr61-final-voxel-section-review.test.mjs scripts/b198zr62-evidence-backed-revision-guidance.test.mjs scripts/b198zr63-architectural-continuity-watch.test.mjs scripts/b198zr64-unclaimed-floor-connectivity.test.mjs scripts/b198zr65-independent-network-feedback.test.mjs scripts/b198zr66-overhead-space-audit.test.mjs scripts/b198zr67-spatial-containment-audit.test.mjs scripts/b198zr68-horizontal-air-continuity.test.mjs scripts/b198zr69-vertical-air-vs-motion.test.mjs scripts/b198zr70-exterior-approach-route-review.test.mjs scripts/b198zr71-abstract-route-gap-triage.test.mjs scripts/b198zr59-safe-result-zip-to-review.test.mjs scripts/b198zr58-frozen-c01-quality-review-packet.test.mjs
