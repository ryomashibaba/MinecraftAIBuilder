name: R34 Fair Evidence Comparison Offline
on:
  push:
    branches: [feature/b198zr1-protected-architectural-revision]
    paths:
      - 'scripts/b198zr34-fair-evidence-comparison-offline*'
      - '.github/workflows/r34-fair-evidence-comparison-offline.yml'
  pull_request:
    paths:
      - 'scripts/b198zr34-fair-evidence-comparison-offline*'
      - '.github/workflows/r34-fair-evidence-comparison-offline.yml'
permissions:
  contents: read
jobs:
  r34-synthetic-comparison-no-model-no-world:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Offline R34 synthetic evidence and strict R4/B143/R3 QA
        run: node --test scripts/b198zr34-fair-evidence-comparison-offline.test.mjs
