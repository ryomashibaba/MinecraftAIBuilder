permissions:
  contents: read
jobs:
  # Real Windows PowerShell 5.1 + cmd.exe bootstrap, fake-only preflight.
  # Clones the public research branch into a NEW isolated runner folder.
  # No live model, no Ollama, no Minecraft, no private content upload.
  windows-v11-click-launcher-smoke:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native CMD launcher -> isolated branch clone -> PowerShell CheckOnly
        shell: cmd
        run: |
          call scripts\R125_V11_3_Buildings.cmd -CheckOnly
          if errorlevel 1 exit /b 1
          call scripts\R125_V11_1117_RIDGE_ART.cmd -CheckOnly
          if errorlevel 1 exit /b 1
          call scripts\R125_V11_3_Buildings.cmd -CheckOnly -OnlyHousingRetail
          if errorlevel 1 exit /b 1
          call scripts\R125_V11_3_Buildings.cmd -CheckOnly -SingleNewBrief
          if errorlevel 1 exit /b 1
          call scripts\R125_V11_3_Buildings.cmd -CheckOnly -SingleNewBrief -Prompt "Original independent functional building and accessible rooms"
          if errorlevel 1 exit /b 1
          call scripts\R125_V11_3_Buildings.cmd -CheckOnly -SingleNewBrief -ComparePriorTide
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\r125-v11-review-existing.ps1 -CheckOnly -NoOpen
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\r125-v11-review-existing.ps1 -CheckOnly -RidgeContrast -NoOpen
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\r125-v11-review-existing.ps1 -CheckOnly -ActivityInlays -NoOpen
          if errorlevel 1 exit /b 1
      - name: Native Windows validates two caller-authored briefs in a single bounded check-only batch
        shell: pwsh
        run: |
          $inputFile = Join-Path $env:RUNNER_TEMP 'mab-two-briefs.json'
          $briefs = @(
            [pscustomobject]@{id='maker-lab';prompt='Create an independent technical maker laboratory with a public demonstration area'},
            [pscustomobject]@{id='civic-gallery';prompt='Build an original civic exhibition room with storage, records and visitor circulation'}
          )
          $json = ConvertTo-Json -InputObject $briefs -Depth 4
          [System.IO.File]::WriteAllText($inputFile,$json,[System.Text.UTF8Encoding]::new($false))
          $check = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\r125-v11-windows-pilot.ps1 -CheckOnly -BriefsFile $inputFile
          if($LASTEXITCODE -ne 0 -or (($check -join ' ') -notmatch '2 supplied original briefs')) {
            throw ('WINDOWS_V11_TWO_BRIEFS_CHECK_FAILED: '+($check -join ' | '))
          }
          Remove-Item -LiteralPath $inputFile -Force
      - name: Education one-click CMD -> PowerShell -> material MakeCode preview, check-only
        shell: cmd
        run: |
          call scripts\R125_V11_EDUCATION_PROBE.cmd -CheckOnly
          if errorlevel 1 exit /b 1
          call scripts\R125_V11_EDUCATION_RECOVERED.cmd -CheckOnly
          if errorlevel 1 exit /b 1
          call scripts\R125_V11_EDUCATION_MOVEMENT.cmd -CheckOnly
          if errorlevel 1 exit /b 1
          call scripts\R125_V11_EDUCATION_RECOVERED.cmd -Stage Preview -CheckOnly
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\r125-v11-tide-roof-ab.ps1 -CheckOnly
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\r125-v11-roof-ab-copy.ps1 -CheckOnly
          if errorlevel 1 exit /b 1
      - name: Native Windows one original brief through mock local HTTP and real B143 four-view render
        shell: pwsh
        run: node --test scripts/r125-v11-custom-prompt-fake-windows.test.mjs
      - name: Windows actual private-style roof A/B replay and material-HOLD (synthetic model only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'mab-v11-private-synthetic'
          $private = Join-Path $env:LOCALAPPDATA 'MinecraftAIBuilder\PrivateModelStudies'
          New-Item -ItemType Directory -Force -Path $private | Out-Null
          node scripts/r125-v11-tide-roof-ab-windows-fixture.mjs $private
          if ($LASTEXITCODE -ne 0) { throw 'SYNTHETIC_FIXTURE_HOLD' }
          $strict = Join-Path $private 'V11_EducationRecovered_CI_SYNTHETIC_STRICT'
          $outA = Join-Path $private 'CI_ROOF_AB_STRICT'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\r125-v11-tide-roof-ab.ps1 -RecoveryDirectory $strict -OutDirectory $outA -NoOpen
          if ($LASTEXITCODE -ne 0) { throw 'STRICT_ROOF_LAUNCH_HOLD' }
          foreach ($file in @('REVIEW.json','ROOF_AB_REVIEW.html','MAKECODE_BASELINE.ts','MAKECODE_COMPACT.ts')) {
            if (-not (Test-Path -LiteralPath (Join-Path $outA $file))) { throw ('STRICT_ARTIFACT_MISSING_'+$file) }
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\r125-v11-roof-ab-copy.ps1 -ComparisonDirectory $outA -Variant COMPACT
          if ($LASTEXITCODE -ne 0) { throw 'COPY_COMPACT_HOLD' }
          $art = Join-Path $private 'V11_EducationRecovered_CI_SYNTHETIC_ART_ONLY'
          $outB = Join-Path $private 'CI_ROOF_AB_UNVERIFIED'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\r125-v11-tide-roof-ab.ps1 -RecoveryDirectory $art -OutDirectory $outB -NoOpen
          if ($LASTEXITCODE -ne 0) { throw 'ART_ONLY_LAUNCH_HOLD' }
          if (-not (Test-Path -LiteralPath (Join-Path $outB 'ROOF_AB_REVIEW.html')) -or
              (Test-Path -LiteralPath (Join-Path $outB 'MAKECODE_BASELINE.ts'))) {
            throw 'UNVERIFIED_MATERIAL_MUST_PRESERVE_ART_WITHOUT_STRICT_MAKECODE'
          }
          Write-Output 'SYNTHETIC_WINDOWS_END_TO_END_PASS_NOT_A_REAL_QWEN_OR_MINECRAFT_TEST'
  exact-source-corner-facade-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V11 actual inter-room glass and workstation sightline SOURCE proof
        run: node --test scripts/r125-room-observation.test.mjs
      - name: V11 SOURCE-only architectural massing art alternatives from existing saved model
        run: node --test scripts/r125-v11-massing-art-study.test.mjs
      - name: V11 saved genuine Qwen replay, local plan transport and unchanged B143 tests
        run: |
          node --check source/ai/b198g-local-model-adapter.mjs
          node --check source/ai/r125-explicit-activity-requirements.mjs
          node --check source/ai/b198c-spatial-critic.mjs
          node --check source/ai/r125-room-fixtures.mjs
          node --check source/ai/r125-room-scale.mjs
          node --check source/ai/r125-room-daylight.mjs
          node --check scripts/r125-local-architecture-plan-run.mjs
          node --check scripts/r125-static-art-review.mjs
          node --check scripts/r125-recovered-art-review.mjs
          node --check scripts/r125-v11-finish-art-ab.mjs
          node --check scripts/r125-roof-ribbon-ab.mjs
          node --check scripts/r125-material-probe.mjs
          node --check scripts/r125-local-architecture-plan-batch.mjs
          node --check scripts/r125-batch-compare.mjs
          node --check scripts/r125-saved-three-genre-baseline.mjs
          node --test scripts/r125-saved-three-genre-baseline.test.mjs scripts/r125-form-review-gallery.test.mjs
          pwsh -NoProfile -File scripts/r125-v11-windows-pilot.ps1 -CheckOnly
          node --test scripts/r125-v11-spatial-art.test.mjs scripts/r125-spatial-composition.test.mjs
          node --test scripts/r125-roof-ribbon-ab.test.mjs scripts/r125-roof-interior-study.test.mjs scripts/r125-v11-education-input-check.test.mjs scripts/r125-offline-replay.test.mjs scripts/r125-architecture-plan.test.mjs scripts/r125-local-architecture-plan-run.test.mjs scripts/r125-local-architecture-plan-batch.test.mjs scripts/r125-static-art-review.test.mjs scripts/r125-recovered-art-review.test.mjs scripts/b198g-local-adapter.test.mjs scripts/r125-material-probe.test.mjs
      - name: Export saved real-Qwen B143 3D HTML for human ART review
        run: |
          node scripts/r125-offline-replay.mjs --architecture-plan --raw evidence/r125-real-l-corner-20261101/MODEL_RESPONSE_ORIGINAL.txt --out "$RUNNER_TEMP/r125-genuine-qwen-3d"
          test -s "$RUNNER_TEMP/r125-genuine-qwen-3d/B143_SOURCE_3D_REVIEW_ONLY.html"
          test -s "$RUNNER_TEMP/r125-genuine-qwen-3d/SOURCE_DIAGNOSIS.json"
      - uses: actions/upload-artifact@v4
        with:
          name: R125-SAVED-REAL-QWEN-TRUE-B143-3D-ART-HOLD
          path: ${{ runner.temp }}/r125-genuine-qwen-3d/
          retention-days: 7
      - name: Render four no-browser B143 PNG views of previously saved Qwen SOURCE
        run: |
          node scripts/r125-static-art-review.mjs --source "$RUNNER_TEMP/r125-genuine-qwen-3d/B143_SOURCE_REVIEW_ONLY.json" --out "$RUNNER_TEMP/r125-genuine-qwen-static-art"
          test -s "$RUNNER_TEMP/r125-genuine-qwen-static-art/EXTERIOR_FRONT_LEFT.png"
          test -s "$RUNNER_TEMP/r125-genuine-qwen-static-art/EXTERIOR_FRONT_RIGHT.png"
          test -s "$RUNNER_TEMP/r125-genuine-qwen-static-art/EXTERIOR_REAR_RIGHT.png"
          test -s "$RUNNER_TEMP/r125-genuine-qwen-static-art/GROUND_FLOOR_CUTAWAY.png"
          test -s "$RUNNER_TEMP/r125-genuine-qwen-static-art/CONTACT_4_VIEWS.png"
          test -s "$RUNNER_TEMP/r125-genuine-qwen-static-art/STATIC_REVIEW.json"
      - uses: actions/upload-artifact@v4
        with:
          name: R125-ARCHIVED-QWEN-B143-NO-BROWSER-STATIC-PNG
          path: ${{ runner.temp }}/r125-genuine-qwen-static-art/
          retention-days: 7
      - name: B143 same-program HOST open court versus enclosed court 4-view ART comparison
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {SCHEMA,compileArchitecturePlan} from './source/ai/r125-architecture-plan.mjs';
          const root=path.join(process.env.RUNNER_TEMP,'r125-host-open-court-ab');
          fs.mkdirSync(root,{recursive:true});
          const p={schema:SCHEMA,id:'court-architecture-art-study',
           title:'Outdoor arrival exhibition with two functional wings',
           brief:'Public outdoor courtyard with an indoor gallery and a repair workshop',
           footprint:{width:32,depth:20},
           levels:[{layoutMode:'spatial-tree',spaces:[
            {id:'public-court',purpose:'Public outdoor gathering and arrival',
             access:'public',fixtures:['seating'],spatialUse:'open-court',
             volume:{width:10,depth:10,roofY:6}},
            {id:'repair-wing',purpose:'Staff repair and tool servicing',
             access:'staff',fixtures:['workbench','tool-rack'],
             volume:{width:9,depth:9,roofY:9,
              attach:{to:'public-court',side:'east',shift:0}}},
            {id:'gallery-wing',purpose:'Indoor public exhibits',
             access:'public',fixtures:['display'],
             volume:{width:9,depth:9,roofY:7,
              attach:{to:'public-court',side:'west',shift:0}}}
           ]}],materials:{floor:'stone',wall:'wood',roof:'metal'}};
          for(const [label,open] of [['covered-baseline',false],['open-public-court',true]]){
           const copy=structuredClone(p);
           if(!open)delete copy.levels[0].spaces[0].spatialUse;
           const built=compileArchitecturePlan(copy);
           if(built.sourceRoutes.status!=='SOURCE_ROUTES_REACH_ALL_ZONES'||
              built.worldWrites!==0)throw Error('SOURCE_OR_WORLD_HOLD_'+label);
           fs.writeFileSync(path.join(root,label+'.json'),JSON.stringify(built.design));
          }
          NODE
          node scripts/r125-static-art-review.mjs --source "$RUNNER_TEMP/r125-host-open-court-ab/covered-baseline.json" --out "$RUNNER_TEMP/r125-host-open-court-ab/covered-views"
          node scripts/r125-static-art-review.mjs --source "$RUNNER_TEMP/r125-host-open-court-ab/open-public-court.json" --out "$RUNNER_TEMP/r125-host-open-court-ab/open-views"
          test -s "$RUNNER_TEMP/r125-host-open-court-ab/covered-views/CONTACT_4_VIEWS.png"
          test -s "$RUNNER_TEMP/r125-host-open-court-ab/open-views/CONTACT_4_VIEWS.png"
      - uses: actions/upload-artifact@v4
        with:
          name: R125-HOST-SPATIAL-COURT-B143-AB-ART-PENDING
          path: ${{ runner.temp }}/r125-host-open-court-ab/
          retention-days: 7
      - name: Render three archived genuine Qwen genres in ONE real B143 3D baseline
        run: |
          node scripts/r125-saved-three-genre-baseline.mjs --out "$RUNNER_TEMP/r125-saved-three-genre-baseline"
          test -s "$RUNNER_TEMP/r125-saved-three-genre-baseline/index.html"
          test -s "$RUNNER_TEMP/r125-saved-three-genre-baseline/SAVED_3GENRE_BASELINE.json"
      - uses: actions/upload-artifact@v4
        with:
          name: R125-THREE-ARCHIVED-QWEN-GENRES-TRUE-B143-3D
          path: ${{ runner.temp }}/r125-saved-three-genre-baseline/
          if-no-files-found: error
          retention-days: 14
      - name: Generate true B143 7-scene form study with genuine Qwen provenance separated
        run: |
          node scripts/r125-form-review-gallery.mjs --out "$RUNNER_TEMP/r125-form-review"
          test -s "$RUNNER_TEMP/r125-form-review/index.html"
          test -s "$RUNNER_TEMP/r125-form-review/FORM_REVIEW.json"
      - uses: actions/upload-artifact@v4
        with:
          name: R125-QWEN-ARCHIVE-PLUS-ARCHITECTURAL-FORMS-3D
          path: ${{ runner.temp }}/r125-form-review/
          retention-days: 14
      - name: Source-matched archived real-Qwen Education MakeCode export (never executed)
        run: |
          node scripts/r125-japanese-makecode.mjs --plan evidence/r125-real-l-corner-20261101/MODEL_RESPONSE_ORIGINAL.txt --out "$RUNNER_TEMP/r125-qwen-education-source" --palette configs/r125-education-verified-palette-v26.33.json
          test -s "$RUNNER_TEMP/r125-qwen-education-source/MAKECODE_EDUCATION.ts"
          node --input-type=module -e 'import fs from "node:fs";let q=JSON.parse(fs.readFileSync(process.argv[1]));let e=JSON.parse(fs.readFileSync(process.argv[2]));if(q.sourceSha256!==e.sourceSha256||q.geometrySha256!==e.geometrySha256||e.worldWrites!==0||e.programExecuted!==false||e.materialMode!=="STRICT_USER_ATTESTED"||e.BuildPlan.operations.length!==0)process.exit(2)' "$RUNNER_TEMP/r125-genuine-qwen-3d/SOURCE_DIAGNOSIS.json" "$RUNNER_TEMP/r125-qwen-education-source/EXPORT_REPORT.json"
      - uses: actions/upload-artifact@v4
        with:
          name: R125-ARCHIVED-QWEN-EDUCATION-CODE-REVIEW-ONLY
          path: ${{ runner.temp }}/r125-qwen-education-source/
          retention-days: 7
      - name: Actual frozen public modules — no model or Minecraft
        run: |
          node --check scripts/research/r125-v6-corner-facade-contract.test.mjs
          node --check scripts/research/r125-v6-offline-ranked-contrast.mjs
          node --test scripts/research/r125-v6-offline-ranked-contrast.test.mjs scripts/r125-v4j-feasible-envelope.test.mjs scripts/r125-v4j-civic-facade.test.mjs
          node --test scripts/r125-v4d-envelope-integration.test.mjs
      - name: Public original Qwen IR through external author boundary — SOURCE only
        run: |
          node --check scripts/research/mab-external-author-offline.mjs
          node --test scripts/research/mab-external-author-offline.test.mjs
      - name: Evidence boundary
        if: always()
        run: |
          echo 'Public synthetic tests prove legacy full-V6 parity and that ranked-only research is NOT full-V6 repair; never certify original Qwen, ART, Minecraft or formal QA.' >> "$GITHUB_STEP_SUMMARY"
          echo 'External-author R125 replay uses an existing PUBLIC saved Qwen IR, not a new model, not V6 Qwen evidence, not ART or Minecraft.' >> "$GITHUB_STEP_SUMMARY"
          echo 'V11 saved real Qwen original is OFFLINE REPLAY, not a new local-model response or human ART pass.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Three archived genuine Qwen semantic plans can be compared in one truthful B143 3D artifact. They are old inputs, not three NEW generated buildings. No new local model POST.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No model, PRIVATE file, Ollama, paid API, or Minecraft world calls.' >> "$GITHUB_STEP_SUMMARY"
