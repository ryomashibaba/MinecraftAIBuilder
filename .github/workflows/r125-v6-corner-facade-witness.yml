      - scripts/r125-recovered-art-review.test.mjs
      - scripts/r125-v11-education-recovered.ps1
      - scripts/R125_V11_EDUCATION_RECOVERED.cmd
      - scripts/r125-v11-review-existing.ps1
      - scripts/r125-local-architecture-plan-run.test.mjs
      - scripts/r125-local-architecture-plan-batch.mjs
      - scripts/r125-batch-compare.mjs
      - scripts/r125-local-architecture-plan-batch.test.mjs
