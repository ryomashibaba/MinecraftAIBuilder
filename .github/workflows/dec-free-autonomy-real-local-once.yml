name: Dec free autonomy one-off real local Qwen 4B CPU proof

on:
  push:
    branches:
      - research/dec-free-autonomy-solo-pilot-20261104
    paths:
      - 'tools/free-autonomy-solo/real_small_model_ci_once.py'

permissions:
  contents: read

jobs:
  genuine-local-qwen-ephemeral:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch only official public Ollama CPU and Node QA images
        run: |
          docker pull ollama/ollama:latest
          docker pull node:22-bookworm-slim
      - name: Real Ollama 4B inference and bounded two-step source QA in disposable clone
        run: python3 tools/free-autonomy-solo/real_small_model_ci_once.py
      - name: Show honest evidence boundary
        if: always()
        run: |
          echo 'One-time public repo standard CI runner; NO proprietary data / paid API credentials.'
          echo 'qwen3:4b CPU fixture does NOT certify user Windows, qwen3:14b, art quality, 180s TPS, or overnight autonomy.'
