name: B187 Legible Civic Fifteen-Module Network
on:
  push:
    branches: [feature/b187-nebula-ark-legible-civic-network]
    paths:
      - 'source/ai/b187-legible-civic.mjs'
      - 'scripts/b187-fast-probe.mjs'
      - 'scripts/b187-macro.test.mjs'
      - 'scripts/b187-build-preview.mjs'
      - 'scripts/b187-browser-qa.mjs'
      - '.github/workflows/b187-fast.yml'
  pull_request:
    paths:
      - 'source/ai/b187-legible-civic.mjs'
      - 'scripts/b187-fast-probe.mjs'
      - 'scripts/b187-macro.test.mjs'
      - 'scripts/b187-build-preview.mjs'
      - 'scripts/b187-browser-qa.mjs'
      - '.github/workflows/b187-fast.yml'
permissions:
  contents: read
concurrency:
  group: b187-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macro-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source and safe build scripts
        run: |
          node --check source/ai/b187-legible-civic.mjs
          node --check scripts/b187-fast-probe.mjs
      - name: True 21-waypoint 30-source-edge hall network, illuminated architecture and large civic undercity
        run: node scripts/b187-fast-probe.mjs
      - name: Architecture geometry, obstruction and anti-forgery tests
        if: hashFiles('scripts/b187-macro.test.mjs') != ''
        run: node --test scripts/b187-macro.test.mjs
      - name: Build standalone offline 3D city preview
        if: hashFiles('scripts/b187-build-preview.mjs') != ''
        run: node scripts/b187-build-preview.mjs
      - name: Archive city-scale voxel model and interactive preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B187-NEBULA-ARK-Grand-Terminal-3D
          path: b187-evidence/
          if-no-files-found: warn
          retention-days: 14

  chromium-visual-qa:
    needs: [macro-architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA runtime without lockfile mutation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Regenerate offline 3D model from pinned source
        run: node scripts/b187-build-preview.mjs
      - name: Test real Chromium desktop/mobile canvas, all presets, and save screenshots
        run: node scripts/b187-browser-qa.mjs
      - name: Upload actual rendered visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B187-NEBULA-ARK-Desktop-Mobile-Screenshots
          path: |
            b187-evidence/B187_DESKTOP.png
            b187-evidence/B187_MOBILE.png
            b187-evidence/B187_CHROMIUM_QA.json
          if-no-files-found: warn
          retention-days: 14
