name: R54 Future Consent-Gated R50 One-Shot to Diagnostic ZIP — FAKE Only
on:
  push:
    branches: [feature/b198zr1-protected-architectural-revision]
    paths:
      - 'scripts/b198zr54-future-program-first-once.mjs'
      - 'scripts/b198zr54-future-program-first-once.test.mjs'
      - 'scripts/b198zr54-future-one-shot-auto-zip.fake.test.mjs'
      - '.github/workflows/r54-future-program-one-shot-fake-only.yml'
      - 'tools/r55-future/INSTALL_R55_OFFLINE_SOURCE_ONLY.ps1'
      - 'tools/r56-future/RUN_R54_ONE_FRESHLY_APPROVED_REQUEST.ps1'
      - 'scripts/b198zr56-future-wrapper-windows-fake.test.mjs'
      - 'tools/r57-future/START_R54_ONE_QWEN_FUTURE_ONLY.cmd'
      - 'scripts/b198zr57-future-cmd-one-click-fake.test.mjs'
  pull_request:
    paths:
      - 'scripts/b198zr54-future-program-first-once.mjs'
      - 'scripts/b198zr54-future-program-first-once.test.mjs'
      - 'scripts/b198zr54-future-one-shot-auto-zip.fake.test.mjs'
      - '.github/workflows/r54-future-program-one-shot-fake-only.yml'
      - 'tools/r55-future/INSTALL_R55_OFFLINE_SOURCE_ONLY.ps1'
      - 'tools/r56-future/RUN_R54_ONE_FRESHLY_APPROVED_REQUEST.ps1'
      - 'scripts/b198zr56-future-wrapper-windows-fake.test.mjs'
      - 'tools/r57-future/START_R54_ONE_QWEN_FUTURE_ONLY.cmd'
      - 'scripts/b198zr57-future-cmd-one-click-fake.test.mjs'
permissions:
  contents: read
jobs:
  future-gated-r50-fake-and-r52-zip:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fake-only R54 future consent, original SHA, R50 guide and archived R51
        run: node --test scripts/b198zr54-future-program-first-once.test.mjs scripts/b198zr54-future-one-shot-auto-zip.fake.test.mjs scripts/b198zr53-fake-one-shot-to-zip.integration.test.mjs scripts/b198zr52-postcapture-auto-storyboard.test.mjs

  r56-future-runner-against-prebound-fake-only:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail closed if fake localhost 11434 unavailable; verify new R55 source and R56 PowerShell result ZIP
        run: node --test scripts/b198zr56-future-wrapper-windows-fake.test.mjs

  r57-future-single-cmd-with-consumed-latch:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Only prebound fake Ollama receives R57 user YES; verify CMD download pins and one ZIP
        run: node --test scripts/b198zr57-future-cmd-one-click-fake.test.mjs
