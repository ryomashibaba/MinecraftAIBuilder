name: B191 Compared Y69 Y65 Route 3D Viewer
on:
  push:
    branches: [feature/b191-nebula-ark-route-compare-review]
    paths:
      - 'source/ai/b191-route-compare.mjs'
      - 'scripts/b191-fast-probe.mjs'
      - 'scripts/b191-macro.test.mjs'
      - 'scripts/b191-build-preview.mjs'
      - 'scripts/b191-browser-qa.mjs'
      - '.github/workflows/b191-fast.yml'
  pull_request:
    paths:
      - 'source/ai/b191-route-compare.mjs'
      - 'scripts/b191-fast-probe.mjs'
      - 'scripts/b191-macro.test.mjs'
      - 'scripts/b191-build-preview.mjs'
      - 'scripts/b191-browser-qa.mjs'
      - '.github/workflows/b191-fast.yml'
permissions:
  contents: read
concurrency:
  group: b191-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macro-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source and safe build scripts
        run: |
          node --check source/ai/b191-route-compare.mjs
          node --check scripts/b191-fast-probe.mjs
      - name: Two collision-free source route options with measured turns, footprint and 2wide headroom
        run: node scripts/b191-fast-probe.mjs
      - name: Architecture geometry, obstruction and anti-forgery tests
        if: hashFiles('scripts/b191-macro.test.mjs') != ''
        run: node --test scripts/b191-macro.test.mjs
      - name: Build standalone offline 3D city preview
        if: hashFiles('scripts/b191-build-preview.mjs') != ''
        run: node scripts/b191-build-preview.mjs
      - name: Archive city-scale voxel model and interactive preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B191-NEBULA-ARK-Grand-Terminal-3D
          path: b191-evidence/
          if-no-files-found: warn
          retention-days: 14

  chromium-visual-qa:
    needs: [macro-architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA runtime without lockfile mutation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Regenerate offline 3D model from pinned source
        run: node scripts/b191-build-preview.mjs
      - name: Test real Chromium desktop/mobile canvas, all presets, and save screenshots
        run: node scripts/b191-browser-qa.mjs
      - name: Upload actual rendered visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B191-NEBULA-ARK-Desktop-Mobile-Screenshots
          path: |
            b191-evidence/B191_DESKTOP.png
            b191-evidence/B191_MOBILE.png
            b191-evidence/B191_DESKTOP_ANNEX.png
            b191-evidence/B191_DESKTOP_Y69.png
            b191-evidence/B191_DESKTOP_Y65.png
            b191-evidence/B191_MOBILE_ANNEX.png
            b191-evidence/B191_MOBILE_Y69.png
            b191-evidence/B191_MOBILE_Y65.png
            b191-evidence/B191_CHROMIUM_QA.json
          if-no-files-found: warn
          retention-days: 14
