name: Education-first offline QA

on:
  push:
    branches: [main, 'feature/**', 'migration/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen B100 files must remain unchanged
        run: node scripts/verify-freeze.mjs
      - name: Education edition construction safety (offline only)
        run: node scripts/verify-safety.mjs
      - name: B102 room synthesis diagnostics (offline only)
        run: node source/parallel/b102/main/compile-b102.mjs
      - name: B103 adaptive circulation diagnostics (offline only)
        run: node source/parallel/b103/main/compile-b103.mjs
      - name: B104 joint room-gallery design diagnostics (offline only)
        run: node source/parallel/b104/main/compile-b104.mjs
      - name: B105 whole building offline envelope and interior diagnostics
        run: node source/parallel/b105/main/compile-b105.mjs
      - name: B106 generate offline 3D review of 15 buildings
        run: node source/parallel/b106/main/compile-b106.mjs --write-preview
      - name: Save B106 interactive 3D review (offline HTML + data report)
        uses: actions/upload-artifact@v4
        with:
          name: B106-3D-Offline-Review
          path: b106-preview-output/
          if-no-files-found: error
          retention-days: 14
      - name: B107 generate polished roofs, facades and interiors (offline only)
        run: node source/parallel/b107/main/compile-b107.mjs --write-preview
      - name: Save B107 fifteen polished buildings 3D preview
        uses: actions/upload-artifact@v4
        with:
          name: B107-Visual-Architecture-Review
          path: b107-preview-output/
          if-no-files-found: error
          retention-days: 14
      - name: B108 generate repaired exterior and interior review (offline only)
        run: node source/parallel/b108/main/compile-b108.mjs --write-preview
      - name: Save B108 corrected 15-building HTML and source fidelity report
        uses: actions/upload-artifact@v4
        with:
          name: B108-Corrected-Architecture-Review
          path: b108-preview-output/
          if-no-files-found: error
          retention-days: 14
      - name: B109 generate continuous facade/roof/glazing presentation
        run: node source/parallel/b109/main/compile-b109.mjs --write-preview
      - name: Save B109 cohesive 15-building 3D design review
        uses: actions/upload-artifact@v4
        with:
          name: B109-Cohesive-Architecture-Review
          path: b109-preview-output/
          if-no-files-found: error
          retention-days: 14
      - name: B110 functional doors, cores, furniture and Education reference audit
        run: node source/parallel/b110/main/compile-b110.mjs --write-review
      - name: Save B110 functional buildability review and 15 geometry source manifests
        uses: actions/upload-artifact@v4
        with:
          name: B110-Read-Only-Functional-Review
          path: b110-review-output/
          if-no-files-found: error
          retention-days: 14
      - name: B111 occupancy and room approach path review (offline only)
        run: node source/parallel/b111/main/compile-b111.mjs --write-review
      - name: Save B111 room walkability, furniture fit and five interior maps
        uses: actions/upload-artifact@v4
        with:
          name: B111-Interior-Occupancy-Review
          path: b111-review-output/
          if-no-files-found: error
          retention-days: 14
      - name: Install headless Chrome for real browser QA
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install Playwright browser driver (test-only)
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: B108 real Chrome all 15 buildings and mobile screenshot QA
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-b108-browser.mjs
      - name: Save B108 real Chrome rendered visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: B108-Real-Chromium-Visual-Evidence
          path: b108-browser-output/
          if-no-files-found: error
          retention-days: 14
      - name: B109 real Chrome facade, roof, glazing and mobile QA
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-b109-browser.mjs
      - name: Save B109 real Chrome visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: B109-Real-Chromium-Visual-Evidence
          path: b109-browser-output/
          if-no-files-found: error
          retention-days: 14
      - name: B92-B111 regression suite (576 cases)
        working-directory: source
        run: |
          node --experimental-vm-modules --test \
            parallel/b92/main/compile-b92.test.mjs \
            parallel/b93/main/compile-b93.test.mjs \
            parallel/b94/main/compile-b94.test.mjs \
            parallel/b95/main/compile-b95.test.mjs \
            parallel/b96/main/compile-b96.test.mjs \
            parallel/b97/main/compile-b97.test.mjs \
            parallel/b98/main/compile-b98.test.mjs \
            parallel/b99/main/compile-b99.test.mjs \
            parallel/b100/main/compile-b100.test.mjs \
            parallel/b101/main/compile-b101.test.mjs \
            parallel/b102/main/compile-b102.test.mjs \
            parallel/b103/main/compile-b103.test.mjs \
            parallel/b104/main/compile-b104.test.mjs \
            parallel/b105/main/compile-b105.test.mjs \
            parallel/b106/main/compile-b106.test.mjs \
            parallel/b107/main/compile-b107.test.mjs \
            parallel/b108/main/compile-b108.test.mjs \
            parallel/b109/main/compile-b109.test.mjs \
            parallel/b110/main/compile-b110.test.mjs \
            parallel/b111/main/compile-b111.test.mjs
      - name: B101 strict concept-only safety gate
        run: node scripts/verify-b101-safety.mjs
      - name: B102 spatial 3D concept and fail-closed safety gate
        run: node scripts/verify-b102-safety.mjs
      - name: B103 global 3D concept and fail-closed safety gate
        run: node scripts/verify-b103-safety.mjs
      - name: B104 whole-building concept and fail-closed safety gate
        run: node scripts/verify-b104-safety.mjs
      - name: B105 whole building envelope and interior safety gate
        run: node scripts/verify-b105-safety.mjs
      - name: B106 offline preview, registry and construction safety gate
        run: node scripts/verify-b106-safety.mjs
      - name: B107 whole-building polished geometry and construction safety
        run: node scripts/verify-b107-safety.mjs
      - name: B108 repaired roof/facade source provenance and construction safety
        run: node scripts/verify-b108-safety.mjs
      - name: B109 continuous material visual QA and construction safety
        run: node scripts/verify-b109-safety.mjs
      - name: B110 Education reference, door/stair/interior interfaces and construction gate
        run: node scripts/verify-b110-safety.mjs
      - name: B111 interior occupancy provenance and blocked construction safety
        run: node scripts/verify-b111-safety.mjs
