name: Education-first offline QA

on:
  push:
    branches: [main, 'feature/**', 'migration/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen B100 files must remain unchanged
        run: node scripts/verify-freeze.mjs
      - name: Education edition construction safety (offline only)
        run: node scripts/verify-safety.mjs
      - name: B102 room synthesis diagnostics (offline only)
        run: node source/parallel/b102/main/compile-b102.mjs
      - name: B103 adaptive circulation diagnostics (offline only)
        run: node source/parallel/b103/main/compile-b103.mjs
      - name: B104 joint room-gallery design diagnostics (offline only)
        run: node source/parallel/b104/main/compile-b104.mjs
      - name: B105 whole building offline envelope and interior diagnostics
        run: node source/parallel/b105/main/compile-b105.mjs
      - name: B106 generate offline 3D review of 15 buildings
        run: node source/parallel/b106/main/compile-b106.mjs --write-preview
      - name: Save B106 interactive 3D review (offline HTML + data report)
        uses: actions/upload-artifact@v4
        with:
          name: B106-3D-Offline-Review
          path: b106-preview-output/
          if-no-files-found: error
          retention-days: 14
      - name: B107 generate polished roofs, facades and interiors (offline only)
        run: node source/parallel/b107/main/compile-b107.mjs --write-preview
      - name: Save B107 fifteen polished buildings 3D preview
        uses: actions/upload-artifact@v4
        with:
          name: B107-Visual-Architecture-Review
          path: b107-preview-output/
          if-no-files-found: error
          retention-days: 14
      - name: B92-B107 regression suite (472 cases)
        working-directory: source
        run: |
          node --experimental-vm-modules --test \
            parallel/b92/main/compile-b92.test.mjs \
            parallel/b93/main/compile-b93.test.mjs \
            parallel/b94/main/compile-b94.test.mjs \
            parallel/b95/main/compile-b95.test.mjs \
            parallel/b96/main/compile-b96.test.mjs \
            parallel/b97/main/compile-b97.test.mjs \
            parallel/b98/main/compile-b98.test.mjs \
            parallel/b99/main/compile-b99.test.mjs \
            parallel/b100/main/compile-b100.test.mjs \
            parallel/b101/main/compile-b101.test.mjs \
            parallel/b102/main/compile-b102.test.mjs \
            parallel/b103/main/compile-b103.test.mjs \
            parallel/b104/main/compile-b104.test.mjs \
            parallel/b105/main/compile-b105.test.mjs \
            parallel/b106/main/compile-b106.test.mjs \
            parallel/b107/main/compile-b107.test.mjs
      - name: B101 strict concept-only safety gate
        run: node scripts/verify-b101-safety.mjs
      - name: B102 spatial 3D concept and fail-closed safety gate
        run: node scripts/verify-b102-safety.mjs
      - name: B103 global 3D concept and fail-closed safety gate
        run: node scripts/verify-b103-safety.mjs
      - name: B104 whole-building concept and fail-closed safety gate
        run: node scripts/verify-b104-safety.mjs
      - name: B105 whole building envelope and interior safety gate
        run: node scripts/verify-b105-safety.mjs
      - name: B106 offline preview, registry and construction safety gate
        run: node scripts/verify-b106-safety.mjs
      - name: B107 whole-building polished geometry and construction safety
        run: node scripts/verify-b107-safety.mjs
