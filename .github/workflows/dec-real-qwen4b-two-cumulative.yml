name: Dec genuine Qwen4B two cumulative MAB SOURCE cycles in isolated Docker

# Branch-only research cannot receive workflow_dispatch unless this file also
# exists on the default branch. Never edit main to enable this.
# Instead, only an explicitly authorized change to the dedicated request path
# may launch a real model run; ordinary research source/workflow pushes cannot.
# No request file is created by this workflow or by this commit.
on:
  push:
    branches:
      - research/dec-free-autonomy-solo-pilot-20261104
    paths:
      - '.github/dec-qwen4b-approved-run-request.json'

permissions:
  contents: read

jobs:
  two-true-qwen4b-cumulative-source-cycles:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce first-only explicit request and reject every rerun before model pull
        shell: bash
        run: |
          set -euo pipefail
          request='.github/dec-qwen4b-approved-run-request.json'
          if [[ "${GITHUB_EVENT_NAME}" != 'push' || "${GITHUB_RUN_ATTEMPT}" != '1' ]]; then
            echo 'HOLD_REQUEST_NOT_FIRST_PUSH_ATTEMPT_NO_MODEL_CALL'
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" || ! -f "${request}" ]]; then
            echo 'HOLD_REQUEST_COMMIT_OR_FILE_INVALID_NO_MODEL_CALL'
            exit 2
          fi
          # A path filter alone would also allow later edits, delete/re-add or
          # a GitHub "Re-run jobs" action. Require the first add in complete
          # ancestry, and forbid unrelated source edits in the activation commit.
          expected_add="$(printf 'A\\t%s' "${request}")"
          actual_add="$(git diff-tree --no-commit-id --name-status -r HEAD -- "${request}")"
          changed_paths="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          request_history="$(git rev-list HEAD -- "${request}" | wc -l | tr -d '[:space:]')"
          if [[ "${actual_add}" != "${expected_add}" ||
                "${changed_paths}" != "${request}" ||
                "${request_history}" != '1' ]]; then
            echo 'HOLD_REQUEST_REPLAY_OR_MIXED_COMMIT_NO_MODEL_CALL'
            exit 2
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              request = json.loads(Path('.github/dec-qwen4b-approved-run-request.json').read_text(encoding='utf-8'))
          except (OSError, UnicodeError, ValueError):
              request = None
          if request != {'scope': 'DECEMBER_2026', 'authorized_runs': 1}:
              print('HOLD_REQUEST_PAYLOAD_INVALID_NO_MODEL_CALL')
              raise SystemExit(2)
          print('ONE_TIME_REQUEST_FIRST_CREATION_PREFLIGHT_PASS')
          PY
      - name: Real source runner static syntax
        run: |
          python3 -m py_compile tools/free-autonomy-solo/real_qwen4b_two_cumulative_ci.py
          python3 -m py_compile tools/free-autonomy-solo/run_mab_private_continuous.py
      # No image pull and no genuine model execution unless checkpoint
      # retention is owner-approved and a usable recipient cert is supplied.
      # Secrets are visible only to this step and the real runner step.
      - name: FAIL CLOSED before image pulls unless owner enabled encrypted preservation
        env:
          DEC_QWEN4B_ENCRYPTED_CHECKPOINT_APPROVED: ${{ secrets.DEC_QWEN4B_ENCRYPTED_CHECKPOINT_APPROVED }}
          DEC_QWEN4B_RECIPIENT_CERT_PEM: ${{ secrets.DEC_QWEN4B_RECIPIENT_CERT_PEM }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          approved = os.environ.get("DEC_QWEN4B_ENCRYPTED_CHECKPOINT_APPROVED", "")
          cert = os.environ.get("DEC_QWEN4B_RECIPIENT_CERT_PEM", "")
          if (approved != "APPROVE_ENCRYPTED_QA_CHECKPOINT_ONLY"
                  or not cert.startswith("-----BEGIN CERTIFICATE-----\n")
                  or not 0 < len(cert.encode("utf-8")) <= 16384):
              print("HOLD_NO_OWNER_APPROVAL_OR_RECIPIENT_CERT_NO_MODEL_CALL")
              raise SystemExit(2)
          with tempfile.TemporaryDirectory(prefix="dec-cert-preflight-") as d:
              path = Path(d) / "recipient.pem"
              path.write_text(cert, encoding="utf-8")
              check = subprocess.run(
                  ["openssl", "x509", "-in", str(path), "-noout",
                   "-checkend", "86400"],
                  capture_output=True, timeout=15, check=False)
              if check.returncode != 0:
                  print("HOLD_RECIPIENT_CERT_INVALID_OR_EXPIRING_NO_MODEL_CALL")
                  raise SystemExit(2)
          print("OWNER_CHECKPOINT_CONSENT_AND_CERT_PREFLIGHT_PASS")
          PY
      - name: Download public free model and QA images only to disposable CI
        run: |
          docker pull ollama/ollama:latest
          docker pull node:24-bookworm-slim
      - name: True Qwen4B stage1-4 cumulative QA/source commit chain or explicit HOLD
        env:
          # Absent by default. These TWO owner-controlled secrets are both
          # required for a ciphertext-only PRIVATE Git checkpoint handoff.
          DEC_QWEN4B_ENCRYPTED_CHECKPOINT_APPROVED: ${{ secrets.DEC_QWEN4B_ENCRYPTED_CHECKPOINT_APPROVED }}
          DEC_QWEN4B_RECIPIENT_CERT_PEM: ${{ secrets.DEC_QWEN4B_RECIPIENT_CERT_PEM }}
        run: python3 tools/free-autonomy-solo/real_qwen4b_two_cumulative_ci.py
      - name: Publish only sanitized status; never candidate source, patch or raw response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-qwen4b-two-cumulative-source-cycles-sanitized
          path: ${{ runner.temp }}/dec-qwen4b-two-cycles-source-sanitized.json
          if-no-files-found: ignore
          retention-days: 7
      # Public-repository artifacts are readable by others. NEVER upload the
      # PRIVATE Git bundle, model text, keys or plaintext audit data.
      - name: Save explicitly authorized encrypted QA checkpoint only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen4b-private-qa-encrypted-checkpoint
          path: ${{ runner.temp }}/dec-qwen4b-private-qa.cms
          retention-days: 90
          if-no-files-found: ignore
      - name: Confirm outcome scope
        if: always()
        run: echo 'Only public source two real 4B cycles; no 14B, Windows, ART, gameplay, paid API, GitHub push, or Minecraft world.'
