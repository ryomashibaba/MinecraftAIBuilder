name: B173 new NEBULA ARK macro architecture
on:
  push:
    branches: [feature/b173-nebula-ark-grand-terminal]
    paths:
      - 'source/ai/b173-nebula-ark.mjs'
      - 'scripts/b173-fast-probe.mjs'
      - 'scripts/b173-macro.test.mjs'
      - 'scripts/b173-build-preview.mjs'
      - 'scripts/b173-browser-qa.mjs'
      - '.github/workflows/b173-fast.yml'
  pull_request:
    paths:
      - 'source/ai/b173-nebula-ark.mjs'
      - 'scripts/b173-fast-probe.mjs'
      - 'scripts/b173-macro.test.mjs'
      - 'scripts/b173-build-preview.mjs'
      - 'scripts/b173-browser-qa.mjs'
      - '.github/workflows/b173-fast.yml'
permissions:
  contents: read
concurrency:
  group: b173-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macro-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source and safe build scripts
        run: |
          node --check source/ai/b173-nebula-ark.mjs
          node --check scripts/b173-fast-probe.mjs
      - name: Source-backed massive NEW city architecture and two 2x2 accessible flat corridors
        run: node scripts/b173-fast-probe.mjs
      - name: Architecture geometry, obstruction and anti-forgery tests
        if: hashFiles('scripts/b173-macro.test.mjs') != ''
        run: node --test scripts/b173-macro.test.mjs
      - name: Build standalone offline 3D city preview
        if: hashFiles('scripts/b173-build-preview.mjs') != ''
        run: node scripts/b173-build-preview.mjs
      - name: Archive city-scale voxel model and interactive preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B173-NEBULA-ARK-Grand-Terminal-3D
          path: b173-evidence/
          if-no-files-found: warn
          retention-days: 14

  chromium-visual-qa:
    needs: [macro-architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA runtime without lockfile mutation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Regenerate offline 3D model from pinned source
        run: node scripts/b173-build-preview.mjs
      - name: Test real Chromium desktop/mobile canvas, all presets, and save screenshots
        run: node scripts/b173-browser-qa.mjs
      - name: Upload actual rendered visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B173-NEBULA-ARK-Desktop-Mobile-Screenshots
          path: |
            b173-evidence/B173_DESKTOP.png
            b173-evidence/B173_MOBILE.png
            b173-evidence/B173_CHROMIUM_QA.json
          if-no-files-found: warn
          retention-days: 14
