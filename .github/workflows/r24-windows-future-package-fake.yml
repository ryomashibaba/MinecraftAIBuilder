name: R24 Windows Source Package — Fake Model Only
on:
  push:
    branches:
      - feature/b198zr1-protected-architectural-revision
    paths:
      - 'tools/r24-future/**'
      - 'scripts/b198zr24-windows-one-shot.test.mjs'
      - '.github/workflows/r24-windows-future-package-fake.yml'
  pull_request:
    paths:
      - 'tools/r24-future/**'
      - 'scripts/b198zr24-windows-one-shot.test.mjs'
      - '.github/workflows/r24-windows-future-package-fake.yml'
permissions:
  contents: read
jobs:
  actual-windows-fake-ollama-r24:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind fake 127.0.0.1:11434 before ALL model calls
        shell: pwsh
        run: node --test scripts/b198zr24-windows-one-shot.test.mjs
