name: R190-AB Structured JSON-Schema Local Qwen Pilot — FAKE ONLY
on:
  push:
    branches: [feature/b198zr1-protected-architectural-revision]
    paths:
      - 'scripts/r190ab-structured-output-pilot.mjs'
      - 'scripts/r190ab-structured-output-pilot.test.mjs'
      - 'scripts/r190ab-semantic-workshop.ps1'
      - 'source/ai/r190ab-semantic-contract.mjs'
      - 'source/ai/r190-semantic-massing.mjs'
      - 'scripts/r190-semantic-fixtures.mjs'
      - '.github/workflows/r190ab-structured-output-pilot.yml'
      - 'evidence/r190aa/pilot-01/MODEL_RESPONSE_ORIGINAL.txt'
permissions:
  contents: read
jobs:
  fake-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check scripts/r190ab-structured-output-pilot.mjs
      - run: node --check scripts/r190ab-structured-output-pilot.test.mjs
      - run: node --test scripts/r190ab-structured-output-pilot.test.mjs
      - name: Parse Windows preflight script; no Qwen/model calls
        shell: pwsh
        run: |
          $tokens = $null
          $issues = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/r190ab-semantic-workshop.ps1').Path,
            [ref]$tokens, [ref]$issues) | Out-Null
          if ($issues.Count -gt 0) {
            $issues | Format-List | Out-String | Write-Error
            exit 1
          }
          "Windows preflight PowerShell parsed successfully"

