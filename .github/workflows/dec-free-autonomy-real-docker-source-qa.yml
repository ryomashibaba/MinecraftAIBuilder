name: December real MAB and TPS pinned SOURCE Docker QA two-stage private commits

on:
  push:
    branches:
      - research/dec-free-autonomy-solo-pilot-20261104
    paths:
      - 'tools/free-autonomy-solo/real_pinned_source_docker_qa_ci_once.py'
      - 'tools/free-autonomy-solo/promote_private_real_drafts_docker.py'
      - '.github/workflows/dec-free-autonomy-real-docker-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-real-source-docker-qa:
    name: Actual isolated SOURCE QA and two PRIVATE commits - ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        project: [minecraftaibuilder, browser-ink-tps]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull public pinned-project QA runtime only, no paid model
        run: docker pull node:24-bookworm-slim
      - name: Native Docker per-stage QA on actual MAB/TPS protected source clones with synthetic comments
        run: python3 tools/free-autonomy-solo/real_pinned_source_docker_qa_ci_once.py --project ${{ matrix.project }}
      - name: Publish intentionally limited model-FALSE SOURCE-QA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dec-real-source-docker-${{ matrix.project }}
          path: ${{ runner.temp }}/dec-real-source-qa-${{ matrix.project }}.json
          retention-days: 7
          if-no-files-found: warn
      - name: Explain proof boundary
        if: always()
        run: |
          echo 'Genuine GitHub Linux Docker on pinned public project source only.'
          echo 'Candidate generated by static CI comments, NOT local Qwen/Cloud model.'
          echo 'No user Windows/GPU/production game/Minecraft world contact.'
          echo 'No GitHub push, no project ART/180s/4v4/autonomous model certification.'
