name: B198Z-R1 source-only architectural verification
on:
  push:
    branches:
      - feature/b198zr1-protected-architectural-revision
    paths:
      - 'evidence/b198zr1/**'
      - 'evidence/b198zr2/**'
      - 'scripts/b198zr1-strict-source-audit.mjs'
      - 'source/ai/b198zr1-spatial-claims.mjs'
      - 'source/ai/b198zr2-generic-quality-guide.mjs'
      - 'source/ai/b198s-native-ollama-source.mjs'
      - 'scripts/b198zr2-strict-architecture-audit.mjs'
      - 'scripts/b198zr3-functional-review.test.mjs'
      - 'scripts/b198zr3-offline-review.mjs'
      - 'source/ai/b198zr3-functional-review-contract.mjs'
      - 'evidence/b198zr3/**'
      - 'scripts/b198s-native-source.test.mjs'
      - 'docs/B198ZR1_PROTECTED_ARCHITECTURAL_REVISION_JA.md'
      - '.github/workflows/b198zr1-source-audit.yml'
  pull_request:
    paths:
      - 'evidence/b198zr1/**'
      - 'evidence/b198zr2/**'
      - 'scripts/b198zr1-strict-source-audit.mjs'
      - 'source/ai/b198zr1-spatial-claims.mjs'
      - 'source/ai/b198zr2-generic-quality-guide.mjs'
      - 'source/ai/b198s-native-ollama-source.mjs'
      - 'scripts/b198zr2-strict-architecture-audit.mjs'
      - 'scripts/b198zr3-functional-review.test.mjs'
      - 'scripts/b198zr3-offline-review.mjs'
      - 'source/ai/b198zr3-functional-review-contract.mjs'
      - 'evidence/b198zr3/**'
      - 'scripts/b198s-native-source.test.mjs'
      - 'docs/B198ZR1_PROTECTED_ARCHITECTURAL_REVISION_JA.md'
      - '.github/workflows/b198zr1-source-audit.yml'
permissions:
  contents: read
jobs:
  strict-b143-and-abstract-walking:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Strict B143 design compiler and discrete occupancy review
        run: node scripts/b198zr1-strict-source-audit.mjs
      - name: B198Z-R2 genuine compiler and negative architecture regressions
        run: node scripts/b198zr2-strict-architecture-audit.mjs
      - name: Verify native model-transport fixture and quality-guide integration
        run: node --test scripts/b198s-native-source.test.mjs
      - name: Generic functional contract positive and adversarial regressions
        run: node --test scripts/b198zr3-functional-review.test.mjs
      - name: End-to-end offline contract report (non-Minecraft)
        run: |
          node scripts/b198zr3-offline-review.mjs --design evidence/b198zr2/assistant-revised-library-r2.json --contract evidence/b198zr3/r2-functional-review-contract.json --out "$RUNNER_TEMP/b198zr3-offline-report.json"
          test -s "$RUNNER_TEMP/b198zr3-offline-report.json"
