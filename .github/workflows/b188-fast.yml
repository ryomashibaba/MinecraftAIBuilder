name: B188 Three Civic Gates Sixteen-Module Segmentation
on:
  push:
    branches: [feature/b188-nebula-ark-civic-gates-segmented-geometry]
    paths:
      - 'source/ai/b188-civic-gates.mjs'
      - 'scripts/b188-fast-probe.mjs'
      - 'scripts/b188-macro.test.mjs'
      - 'scripts/b188-build-preview.mjs'
      - 'scripts/b188-browser-qa.mjs'
      - '.github/workflows/b188-fast.yml'
  pull_request:
    paths:
      - 'source/ai/b188-civic-gates.mjs'
      - 'scripts/b188-fast-probe.mjs'
      - 'scripts/b188-macro.test.mjs'
      - 'scripts/b188-build-preview.mjs'
      - 'scripts/b188-browser-qa.mjs'
      - '.github/workflows/b188-fast.yml'
permissions:
  contents: read
concurrency:
  group: b188-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macro-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source and safe build scripts
        run: |
          node --check source/ai/b188-civic-gates.mjs
          node --check scripts/b188-fast-probe.mjs
      - name: Three civic gates, lossless three-district source segmentation and 12 proved seam crossings
        run: node scripts/b188-fast-probe.mjs
      - name: Architecture geometry, obstruction and anti-forgery tests
        if: hashFiles('scripts/b188-macro.test.mjs') != ''
        run: node --test scripts/b188-macro.test.mjs
      - name: Build standalone offline 3D city preview
        if: hashFiles('scripts/b188-build-preview.mjs') != ''
        run: node scripts/b188-build-preview.mjs
      - name: Archive city-scale voxel model and interactive preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B188-NEBULA-ARK-Grand-Terminal-3D
          path: b188-evidence/
          if-no-files-found: warn
          retention-days: 14

  chromium-visual-qa:
    needs: [macro-architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA runtime without lockfile mutation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Regenerate offline 3D model from pinned source
        run: node scripts/b188-build-preview.mjs
      - name: Test real Chromium desktop/mobile canvas, all presets, and save screenshots
        run: node scripts/b188-browser-qa.mjs
      - name: Upload actual rendered visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B188-NEBULA-ARK-Desktop-Mobile-Screenshots
          path: |
            b188-evidence/B188_DESKTOP.png
            b188-evidence/B188_MOBILE.png
            b188-evidence/B188_CHROMIUM_QA.json
          if-no-files-found: warn
          retention-days: 14
