name: R190-BS chat-authored 9-floor architecture — OFFLINE ONLY
on:
  push:
    branches: [feature/b198zr1-protected-architectural-revision]
    paths:
      - 'evidence/r190bs/**'
      - 'scripts/r190bs-chat-design-study.mjs'
      - '.github/workflows/r190bs-chat-design.yml'
  pull_request:
    paths:
      - 'evidence/r190bs/**'
      - 'scripts/r190bs-chat-design-study.mjs'
      - '.github/workflows/r190bs-chat-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile preserved chat-authored design offline without local model
        env:
          NODE_OPTIONS: --import=./scripts/r190bo-deny-network.mjs
        run: node scripts/r190bs-chat-design-study.mjs --out bs-ci-evidence
      - name: Preserve source and diagnostic artifacts even if architectural QA fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R190BS-CHAT-OFFLINE-${{ matrix.os }}
          path: bs-ci-evidence
          if-no-files-found: warn
