                $fiveInitial.sourceCandidates -ne 0 -or
                $fiveInitial.worldWrites -ne 0 -or
                $fiveSafe.additionalModelCalls -ne 0 -or
                $fiveSafe.networkCalls -ne 0 -or
                $fiveSafe.attemptedOfflineReplays -ne 5 -or
                $fiveSafe.sourceReproducedCount -ne 0 -or
                $fiveSafe.worldWrites -ne 0 -or
                $fiveSafe.syntheticRunsNeverPromoted -ne $true -or
                $fiveSafe.userArtAssessment -ne 'NOT_REVIEWED') {
              throw "V4J_FIVE_REAL_WINDOWS_FAKE_OR_OFFLINE_REPLAY_SAFETY_BROKEN"
            }
            if (@(Get-Content -LiteralPath $env:MAB_V4D_FAKE_POST_LOG).Count -ne 7) {
