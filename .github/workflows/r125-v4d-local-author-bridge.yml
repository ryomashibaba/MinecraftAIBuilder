            foreach ($secret in @('LOCAL_REQUEST','127.0.0.1','MODEL_RESPONSE_ORIGINAL','PrivateModelStudies')) {
              if ($plain.Contains($secret)) { throw "V4H_HANDOFF_LEAKED_PRIVATE_DETAIL_$secret" }
