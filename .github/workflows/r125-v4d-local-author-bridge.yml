            $v4hStdout = Join-Path $env:RUNNER_TEMP 'v4h_launcher_stdout.txt'
            $v4hStderr = Join-Path $env:RUNNER_TEMP 'v4h_launcher_stderr.txt'
            $v4hArgs = @('-NoProfile','-File',(Join-Path $PWD 'scripts/r125-v4h-real-qwen-trial.ps1'),'-ExpectedCommit',$env:GITHUB_SHA)
            $child = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList $v4hArgs -NoNewWindow -PassThru -Wait -RedirectStandardOutput $v4hStdout -RedirectStandardError $v4hStderr
            Get-Content -LiteralPath $v4hStdout | ForEach-Object { Write-Host $_ }
            if ($child.ExitCode -ne 2) {
              Get-Content -LiteralPath $v4hStderr | ForEach-Object { Write-Host $_ }
              throw "V4H_USER_LAUNCHER_FAKE_HOLD_EXIT_2_REQUIRED_$($child.ExitCode)"
            }
            if (@(Get-Content -LiteralPath $env:MAB_V4D_FAKE_POST_LOG).Count -ne ($beforeV4HPosts + 1)) {
              throw 'V4H_ONE_AND_ONLY_ONE_FAKE_POST'
            }
            $share = @(Get-ChildItem -LiteralPath $private -File -Filter 'V4H_HANDOFF_*.json')
            if ($share.Count -ne 1) { throw 'V4H_SAFE_ONE_FILE_HANDOFF_MISSING' }
            $result = Get-Content -LiteralPath $share[0].FullName -Raw | ConvertFrom-Json
            if ($result.schema -ne 'minecraftaibuilder-r125-v4h-one-local-qwen-audition-handoff-v1' -or
                $result.researchHead -ne $env:GITHUB_SHA -or
