name: B183 Vertical Urban Eleven-Module Galleries
on:
  push:
    branches: [feature/b183-nebula-ark-connected-vertical-urban-galleries]
    paths:
      - 'source/ai/b183-vertical-urban.mjs'
      - 'scripts/b183-fast-probe.mjs'
      - 'scripts/b183-macro.test.mjs'
      - 'scripts/b183-build-preview.mjs'
      - 'scripts/b183-browser-qa.mjs'
      - '.github/workflows/b183-fast.yml'
  pull_request:
    paths:
      - 'source/ai/b183-vertical-urban.mjs'
      - 'scripts/b183-fast-probe.mjs'
      - 'scripts/b183-macro.test.mjs'
      - 'scripts/b183-build-preview.mjs'
      - 'scripts/b183-browser-qa.mjs'
      - '.github/workflows/b183-fast.yml'
permissions:
  contents: read
concurrency:
  group: b183-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macro-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source and safe build scripts
        run: |
          node --check source/ai/b183-vertical-urban.mjs
          node --check scripts/b183-fast-probe.mjs
      - name: Complete nine lower-hall-to-upper-hall two-wide geometry route proofs
        run: node scripts/b183-fast-probe.mjs
      - name: Architecture geometry, obstruction and anti-forgery tests
        if: hashFiles('scripts/b183-macro.test.mjs') != ''
        run: node --test scripts/b183-macro.test.mjs
      - name: Build standalone offline 3D city preview
        if: hashFiles('scripts/b183-build-preview.mjs') != ''
        run: node scripts/b183-build-preview.mjs
      - name: Archive city-scale voxel model and interactive preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B183-NEBULA-ARK-Grand-Terminal-3D
          path: b183-evidence/
          if-no-files-found: warn
          retention-days: 14

  chromium-visual-qa:
    needs: [macro-architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA runtime without lockfile mutation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Regenerate offline 3D model from pinned source
        run: node scripts/b183-build-preview.mjs
      - name: Test real Chromium desktop/mobile canvas, all presets, and save screenshots
        run: node scripts/b183-browser-qa.mjs
      - name: Upload actual rendered visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B183-NEBULA-ARK-Desktop-Mobile-Screenshots
          path: |
            b183-evidence/B183_DESKTOP.png
            b183-evidence/B183_MOBILE.png
            b183-evidence/B183_CHROMIUM_QA.json
          if-no-files-found: warn
          retention-days: 14
