name: B190 Reviewed Source Gateway Two-Model Five-Scene QA
on:
  push:
    branches: [feature/b190-nebula-ark-reviewed-model-gateway]
    paths:
      - 'source/ai/b190-source-gateway.mjs'
      - 'scripts/b190-fast-probe.mjs'
      - 'scripts/b190-macro.test.mjs'
      - 'scripts/b190-build-preview.mjs'
      - 'scripts/b190-browser-qa.mjs'
      - '.github/workflows/b190-fast.yml'
  pull_request:
    paths:
      - 'source/ai/b190-source-gateway.mjs'
      - 'scripts/b190-fast-probe.mjs'
      - 'scripts/b190-macro.test.mjs'
      - 'scripts/b190-build-preview.mjs'
      - 'scripts/b190-browser-qa.mjs'
      - '.github/workflows/b190-fast.yml'
permissions:
  contents: read
concurrency:
  group: b190-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macro-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source and safe build scripts
        run: |
          node --check source/ai/b190-source-gateway.mjs
          node --check scripts/b190-fast-probe.mjs
      - name: Fail-closed virtual 2wide bridge between independently source-verified buildings
        run: node scripts/b190-fast-probe.mjs
      - name: Architecture geometry, obstruction and anti-forgery tests
        if: hashFiles('scripts/b190-macro.test.mjs') != ''
        run: node --test scripts/b190-macro.test.mjs
      - name: Build standalone offline 3D city preview
        if: hashFiles('scripts/b190-build-preview.mjs') != ''
        run: node scripts/b190-build-preview.mjs
      - name: Archive city-scale voxel model and interactive preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B190-NEBULA-ARK-Grand-Terminal-3D
          path: b190-evidence/
          if-no-files-found: warn
          retention-days: 14

  chromium-visual-qa:
    needs: [macro-architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA runtime without lockfile mutation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Regenerate offline 3D model from pinned source
        run: node scripts/b190-build-preview.mjs
      - name: Test real Chromium desktop/mobile canvas, all presets, and save screenshots
        run: node scripts/b190-browser-qa.mjs
      - name: Upload actual rendered visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B190-NEBULA-ARK-Desktop-Mobile-Screenshots
          path: |
            b190-evidence/B190_DESKTOP.png
            b190-evidence/B190_MOBILE.png
            b190-evidence/B190_DESKTOP_ANNEX.png
            b190-evidence/B190_MOBILE_ANNEX.png
            b190-evidence/B190_CHROMIUM_QA.json
          if-no-files-found: warn
          retention-days: 14
