permissions:
  contents: read
# Cancel obsolete checks when successive source-only commits update the same
# draft PR. Only its latest source SHA can provide an acceptance verdict.
concurrency:
  group: b198g-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  r172-quick-three-use-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R172 quick synthetic three-use 3D regression
        run: |
          node --check scripts/r172-ci-autoreview.mjs
          node --test scripts/r172-ci-autoreview.test.mjs
          node --test scripts/r177-ground-intent.test.mjs
          node --test scripts/r178-wing-comparison.test.mjs
          node --test scripts/r180-variable-massing.test.mjs
          node --test scripts/r181-courtyard-graph.test.mjs
          node --test scripts/r182-room-led-section.test.mjs
          node --test scripts/r183-courtyard-void.test.mjs
          node --test scripts/r184-composition-options.test.mjs
          node --test scripts/r185-public-experience.test.mjs
      - name: R178 independent wing-courtyard synthetic 3D preview
        run: |
          node --check source/ai/r178-wing-courtyard.mjs
          node --check scripts/r178-wing-comparison.mjs
          node scripts/r178-wing-comparison.mjs --out r178-independent-wing-court
      - name: Upload R178 independent physical wings and courtyard 3D evidence
        uses: actions/upload-artifact@v4
        with:
          name: R178-INDEPENDENT-THREE-USE-WING-COURT-3D
          path: r178-independent-wing-court/
          retention-days: 14
          if-no-files-found: error
      - name: R180 matched-program wing envelope geometry preview
        run: |
          node --check scripts/r180-variable-massing-comparison.mjs
          node scripts/r180-variable-massing-comparison.mjs --out r180-matched-program-massing
      - name: Upload R180 source-only massing versus R178 comparison
        uses: actions/upload-artifact@v4
        with:
          name: R180-MATCHED-PROGRAM-WING-MASSING-3D
          path: r180-matched-program-massing/
          retention-days: 14
          if-no-files-found: error
      - name: R181 three-volume source-only courtyard graph real B143
        run: |
          node --check source/ai/r181-courtyard-graph.mjs
          node --check scripts/r181-courtyard-graph-comparison.mjs
          node scripts/r181-courtyard-graph-comparison.mjs --out r181-three-volume-court
      - name: Upload R181 source-only three-volume 3D and all views
        uses: actions/upload-artifact@v4
        with:
          name: R181-THREE-VOLUME-COURTYARD-3D
          path: r181-three-volume-court/
          retention-days: 14
          if-no-files-found: error
      - name: R182 actual three-volume roof section versus R181 comparison
        run: |
          node --check source/ai/r182-room-led-section.mjs
          node --check scripts/r182-room-led-section-comparison.mjs
          node scripts/r182-room-led-section-comparison.mjs --out r182-room-led-section
      - name: Upload R182 matched-use source-only stepped section 3D
        uses: actions/upload-artifact@v4
        with:
          name: R182-ROOM-LED-SECTION-R181-COMPARISON-3D
          path: r182-room-led-section/
          retention-days: 14
          if-no-files-found: error
      - name: R183 real source-only carved courtyard mass 3-use comparison
        run: |
          node --check source/ai/r183-courtyard-negative-mass.mjs
          node --check scripts/r183-courtyard-void-comparison.mjs
          node scripts/r183-courtyard-void-comparison.mjs --out r183-negative-mass-source
      - name: Upload R183 roof-void real B143 comparison
        uses: actions/upload-artifact@v4
        with:
          name: R183-TRUE-NEGATIVE-MASS-THREE-USE-3D
          path: r183-negative-mass-source/
          retention-days: 14
          if-no-files-found: error
      - name: R184 produce 3 real B143 whole-massing architecture form alternatives
        run: |
          node --check source/ai/r184-composition-grammar.mjs
          node --check scripts/r184-composition-options.mjs
          node scripts/r184-composition-options.mjs --out r184-art-first-geometry
      - name: Upload R184 source-only true 3D form alternatives
        uses: actions/upload-artifact@v4
        with:
          name: R184-ART-FIRST-THREE-DISTINCT-WHOLE-FORMS-3D
          path: r184-art-first-geometry/
          retention-days: 14
          if-no-files-found: error
      - name: R185 create two grounded public-arrival B143 architecture comparisons
        run: |
          node --check source/ai/r185-public-experience.mjs
          node --check scripts/r185-public-experience-comparison.mjs
          node scripts/r185-public-experience-comparison.mjs --out r185-public-arrival-review
      - name: Upload R185 ground-public-experience 3D comparison
        uses: actions/upload-artifact@v4
        with:
          name: R185-HUMAN-SCALE-ARRIVAL-TWO-ARCHITECTURAL-FORMS-3D
          path: r185-public-arrival-review/
          retention-days: 14
          if-no-files-found: error
      - name: R172 quick automatic three-use 3D preview
        run: node scripts/r172-ci-autoreview.mjs --out r172-auto-three-use-review
      - name: Upload R172 synthetic 3D and five-view comparison
        uses: actions/upload-artifact@v4
        with:
          name: R172-CI-THREE-USE-SOURCE-3D
          path: r172-auto-three-use-review/
          retention-days: 14
          if-no-files-found: error
  original-source-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R147 real fresh Node process import cycle smoke (before expensive QA)
        run: |
          node --check scripts/r139-relational-instructions.mjs
          node --check scripts/r147-esm-import-order.test.mjs
          node --test scripts/r147-esm-import-order.test.mjs
      - name: B198A-G original regressions and source topology QA
        run: |
          node --test \
            scripts/b198a-engine.test.mjs \
            scripts/b198b-quality.test.mjs \
            scripts/b198c-critic.test.mjs \
