      - 'scripts/r125-functional-acceptance.test.mjs'
      - 'scripts/fixtures/r125-qwen14b-shop-20261024.json'
      - 'scripts/fixtures/r125-qwen14b-research-20261024.json'
      - 'source/ai/b198c-spatial-critic.mjs'
      - 'scripts/r125-real-plan-replay.test.mjs'
      - 'scripts/fixtures/r125-qwen14b-residential-2024a.json'
      - '.github/workflows/b198g-quality.yml'
permissions:
  contents: read
# Cancel obsolete checks when successive source-only commits update the same
# draft PR. Only its latest source SHA can provide an acceptance verdict.
concurrency:
  group: b198g-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-source-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R147 real fresh Node process import cycle smoke (before expensive QA)
        run: |
          node --check scripts/r139-relational-instructions.mjs
          node --check scripts/r147-esm-import-order.test.mjs
          node --test scripts/r147-esm-import-order.test.mjs
      - name: B198A-G original regressions and source topology QA
        run: |
          node --test \
            scripts/b198a-engine.test.mjs \
            scripts/b198b-quality.test.mjs \
            scripts/b198c-critic.test.mjs \
            scripts/b198d-session.test.mjs \
            scripts/b198e-pilot.test.mjs \
            scripts/b198f-evidence.test.mjs \
            scripts/b198g-autonomous-quality.test.mjs \
            scripts/b198g-local-adapter.test.mjs
      - name: R125 one-shot local-HTTP fixture, real B143 voxels, fail-closed world gates
        run: |
          node --check scripts/r125-mvp.mjs
          node --check scripts/r125-mvp.test.mjs
          node --check scripts/r125-pilot.mjs
          node --check scripts/r125-pilot.test.mjs
          node --check scripts/r125-offline-replay.mjs
          node --check scripts/r125-offline-replay.test.mjs
          node --check source/ai/r125-architecture-plan.mjs
          node --check scripts/r125-architecture-plan.test.mjs
          node --check scripts/r125-semantic-pilot.mjs
          node --check scripts/r125-semantic-pilot.test.mjs
          node --check scripts/r125-real-plan-replay.test.mjs
          node --check scripts/r125-expression-gallery.mjs
          node --check scripts/r125-expression-gallery.test.mjs
          node --check scripts/r125-multiuse-pilot.mjs
          node --check scripts/r125-multiuse-pilot.test.mjs
          node --check scripts/r125-real-multiuse-replay.test.mjs
          node --check source/ai/r125-source-routes.mjs
          node --check source/ai/r125-entrance-repair.mjs
          node --check source/ai/r125-functional-layer.mjs
          node --check scripts/r125-functional-layer.test.mjs
          node --check scripts/r125-functional-preview.mjs
          node --check scripts/r125-functional-preview.test.mjs
          node --check scripts/r131-real-3d-comparison.mjs
          node --check scripts/r131-real-3d-comparison.test.mjs
          node --check source/ai/r132-spatial-relations.mjs
          node --check scripts/r132-spatial-comparison.mjs
          node --check scripts/r132-spatial-comparison.test.mjs
          node --check scripts/r133-spatial-onepass.mjs
          node --check scripts/r133-spatial-onepass.test.mjs
          node --check source/ai/r134-multi-zone-plan.mjs
          node --check scripts/r134-multi-zone-plan.test.mjs
          node --check scripts/r134-fresh-model-pilot.mjs
          node --check scripts/r134-fresh-model-pilot.test.mjs
          node --check scripts/r134-multi-zone-gallery.mjs
          node --check scripts/r134-multi-zone-gallery.test.mjs
          node --check scripts/r135-furnished-program.mjs
          node --check scripts/r135-furnished-program.test.mjs
          node --check scripts/r136-local-evidence.mjs
          node --check scripts/r136-local-evidence.test.mjs
          node --check scripts/r137-bounded-recovery.mjs
          node --check scripts/r137-bounded-recovery.test.mjs
          node --check scripts/r137-user-capture-replay.mjs
          node --check scripts/r137-user-capture-replay.test.mjs
          node --check source/ai/r138-branching-topology.mjs
          node --check scripts/r138-branching-topology.test.mjs
          node --check scripts/r138-user-branch-comparison.mjs
          node --check scripts/r138-user-branch-comparison.test.mjs
          node --check source/ai/r139-room-relations.mjs
          node --check scripts/r139-room-relations.test.mjs
          node --check scripts/r139-relational-model.mjs
          node --check source/ai/r154-volume-composition.mjs
          node --check source/ai/r155-roofline.mjs
          node --check scripts/r139-relational-model.test.mjs
          node --check scripts/r139-user-qwen-relations-comparison.mjs
          node --check scripts/r139-user-qwen-relations-comparison.test.mjs
          node --check scripts/r140-relational-local-runner.test.mjs
          node --check scripts/r141-local-graph-evidence.mjs
          node --check scripts/r141-local-graph-evidence.test.mjs
          node --check scripts/r143-independent-graph-audit.mjs
          node --check scripts/r143-independent-graph-audit.test.mjs
          node --check source/ai/r146-roof-material-boundary.mjs
          node --check scripts/r146-replay-saved-qwen.mjs
          node --check scripts/r146-user-real-roof-recovery.test.mjs
          node --check scripts/r125-feature-model-pilot.mjs
          node --check scripts/r125-feature-model-pilot.test.mjs
          node --check source/ai/r125-functional-acceptance.mjs
          node --check scripts/r125-functional-acceptance.test.mjs
          node --check scripts/r156-unknown-use-study.mjs
          node --check scripts/r156-unknown-use-study.test.mjs
          node --test scripts/r125-mvp.test.mjs scripts/r125-world-diff.test.mjs scripts/r125-pilot.test.mjs scripts/r125-offline-replay.test.mjs scripts/r125-architecture-plan.test.mjs scripts/r125-semantic-pilot.test.mjs scripts/r125-real-plan-replay.test.mjs scripts/r125-expression-gallery.test.mjs scripts/r125-multiuse-pilot.test.mjs scripts/r125-real-multiuse-replay.test.mjs scripts/r125-functional-layer.test.mjs scripts/r125-functional-preview.test.mjs scripts/r125-feature-model-pilot.test.mjs scripts/r125-functional-acceptance.test.mjs scripts/r131-real-3d-comparison.test.mjs scripts/r132-spatial-comparison.test.mjs scripts/r133-spatial-onepass.test.mjs scripts/r135-furnished-program.test.mjs scripts/r134-multi-zone-plan.test.mjs scripts/r134-fresh-model-pilot.test.mjs scripts/r134-multi-zone-gallery.test.mjs scripts/r136-local-evidence.test.mjs scripts/r137-bounded-recovery.test.mjs scripts/r137-user-capture-replay.test.mjs scripts/r138-branching-topology.test.mjs scripts/r138-user-branch-comparison.test.mjs scripts/r139-room-relations.test.mjs scripts/r139-relational-model.test.mjs scripts/r139-user-qwen-relations-comparison.test.mjs scripts/r140-relational-local-runner.test.mjs scripts/r141-local-graph-evidence.test.mjs scripts/r143-independent-graph-audit.test.mjs scripts/r146-user-real-roof-recovery.test.mjs scripts/r149-quality-comparison.test.mjs scripts/r156-unknown-use-study.test.mjs
      - name: Build genuine-source four-scene visual review
        run: node scripts/r125-expression-gallery.mjs --out r125-expression-preview
      - name: Upload source-only 3D comparison for human review
        uses: actions/upload-artifact@v4
        with:
          name: R125-EXPRESSION-FOUR-3D-VIEWS
          path: r125-expression-preview/
          retention-days: 14
          if-no-files-found: error
      - name: Render source-pinned before and after functional previews
        run: node scripts/r131-real-3d-comparison.mjs --out r131-functional-comparison
      - name: Upload before and after functional 3D scenes
        uses: actions/upload-artifact@v4
        with:
          name: R125-QWEN14B-SHOP-RESEARCH-FUNCTIONAL-3D
          path: r131-functional-comparison/
          retention-days: 14
          if-no-files-found: error
      - name: Build source-only spatial correction 3D comparison
        run: node scripts/r132-spatial-comparison.mjs --out r132-spatial-comparison
      - name: Upload bounded spatial-correction B143 scenes
        uses: actions/upload-artifact@v4
        with:
          name: R132-QWEN14B-SPATIAL-ORDER-3D
          path: r132-spatial-comparison/
          retention-days: 14
          if-no-files-found: error
      - name: Build independent new three and four room genuine 3D review
        run: node scripts/r134-multi-zone-gallery.mjs --out r134-multi-zone-review
      - name: Upload new multi room source only 3D scenes
        uses: actions/upload-artifact@v4
        with:
          name: R134-NEW-MULTIZONE-THREE-3D-SCENES
          path: r134-multi-zone-review/
          retention-days: 14
          if-no-files-found: error
      - name: Replay user uploaded REAL Qwen14B saved raw into real host derived 3D
        run: node scripts/r137-user-capture-replay.mjs --out r137-user-real-qwen-3d
      - name: Upload host derived scenes from exact real Qwen14B replies
        uses: actions/upload-artifact@v4
        with:
          name: R137-REAL-QWEN14B-THREE-BUILDINGS-3D-REPLAY
          path: r137-user-real-qwen-3d/
          retention-days: 14
          if-no-files-found: error
      - name: Build exact-user-Qwen strip vs branch six scene real source 3D
        run: node scripts/r138-user-branch-comparison.mjs --out r138-qwen-branch-3d
      - name: Upload real source branched topology comparative views
        uses: actions/upload-artifact@v4
        with:
          name: R138-REAL-QWEN14B-STRIP-VS-BRANCH-3D
          path: r138-qwen-branch-3d/
          retention-days: 14
          if-no-files-found: error
      - name: Build authentic archived Qwen semantic rooms versus host-origin room graph
        run: node scripts/r139-user-qwen-relations-comparison.mjs --out r139-room-graph-3d
      - name: Upload R139 source-only room graph comparison for human art review
        uses: actions/upload-artifact@v4
        with:
          name: R139-REAL-QWEN-SEMANTICS-HOST-GRAPH-3D
          path: r139-room-graph-3d/
          retention-days: 14
          if-no-files-found: error
      - name: Replay real Qwen14B graph with exactly one transparently host-corrected roof material
        run: node scripts/r146-replay-saved-qwen.mjs --out r146-saved-real-qwen-roof-review
      - name: Upload R146 full real Qwen source-only offline recovered 3D
        uses: actions/upload-artifact@v4
        with:
          name: R146-REAL-QWEN14B-ONE-FIELD-HOST-CORRECTED-3D
          path: r146-saved-real-qwen-roof-review/
          retention-days: 14
          if-no-files-found: error
      - name: Build R149 genuine B143 before-after architectural quality review
        run: node scripts/r149-quality-comparison.mjs --out r149-architectural-comparison
      - name: Upload R149 original versus host-derived genuine B143 3D
        uses: actions/upload-artifact@v4
        with:
          name: R149-REAL-QWEN-ARCHITECTURAL-QUALITY-3D-COMPARISON
          path: r149-architectural-comparison/
          retention-days: 14
          if-no-files-found: error
      - name: Keep the original Minecraft world offline
        run: |
          node --check source/ai/b198g-autonomous-quality.mjs
          node --check scripts/b198g-autonomous-quality.test.mjs
          node --check source/ai/b198g-local-model-adapter.mjs
          node --check scripts/b198g-local-design.mjs
          node --check scripts/b198g-local-adapter.test.mjs
